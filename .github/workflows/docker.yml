# Docker 镜像：推到 main 时只构建 + 冒烟测试；发版（推送 v* 标签）时构建 amd64 / arm64，
# 推到 ghcr.io/zyc009234/xerp，并把离线镜像包（docker load 用）附到对应的 GitHub Release
name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'android/**', 'windows/**', 'fnos/**']
  workflow_dispatch:

permissions:
  contents: write   # 往 Release 上传离线镜像包
  packages: write   # 推镜像到 ghcr.io

env:
  IMAGE: ghcr.io/zyc009234/xerp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 冒烟测试：构建本机架构镜像并跑起来
        run: |
          docker build -t xerp:test .
          docker run -d --name xerp-ci -p 8686:8686 -e XERP_STATS_URL= -e XERP_FEEDBACK_URL= -e XERP_ADMIN_PASSWORD=ci-pass-123 xerp:test
          for i in $(seq 30); do curl -sf http://127.0.0.1:8686/api/ping && break; sleep 1; done
          curl -sf http://127.0.0.1:8686/api/ping | grep -q '"app":"XERP"'
          curl -sf http://127.0.0.1:8686/ | grep -q '<title>'
          # 环境变量设的初始密码生效、默认密码不能登录
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"username":"admin","password":"ci-pass-123"}' http://127.0.0.1:8686/api/login | grep -q token
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}' http://127.0.0.1:8686/api/login)" = 401
          # 数据写在 /data，时区是北京时间
          docker exec xerp-ci ls /data/erp.db /data/config.json
          test "$(docker exec xerp-ci node -e 'console.log(new Date().getTimezoneOffset())')" = -480
          docker inspect --format '{{.State.Health.Status}}' xerp-ci
          docker rm -f xerp-ci

      - name: 版本号
        if: startsWith(github.ref, 'refs/tags/v')
        id: v
        run: echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: docker/setup-buildx-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送多架构镜像到 ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.ver }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Zyc009234/x.erp
            org.opencontainers.image.description=x.erp 轻量 ERP：进销存、财务、人事，数据留在自己的 NAS 里
            org.opencontainers.image.licenses=AGPL-3.0

      - name: 离线镜像包（国内拉不动 ghcr.io 时用 docker load 导入）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.ver }}
        run: |
          for arch in amd64 arm64; do
            docker pull --platform linux/$arch "$IMAGE:$VER"
            docker tag "$IMAGE:$VER" "$IMAGE:latest"   # 导入后和 docker-compose.yml 里的镜像名一致，不用改配置
            docker save "$IMAGE:$VER" "$IMAGE:latest" | gzip -9 > "xerp-$VER-docker-$arch.tar.gz"
            docker rmi "$IMAGE:$VER" "$IMAGE:latest"
          done
          ls -lh xerp-*-docker-*.tar.gz
          # Release 可能由本地脚本稍后才建好，等一会儿
          for i in $(seq 30); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$GITHUB_REF_NAME" xerp-*-docker-*.tar.gz --clobber
