# Docker 镜像：推到 main 时只构建 + 冒烟测试；发版（推送 v* 标签）时构建 amd64 / arm64，
# 推到 ghcr.io/zyc009234/xerp 和 Docker Hub zyc009234xerp/xerp，并把离线镜像包（docker load 用）附到对应的 GitHub Release。
# 手动运行时填上版本标签（如 v2.0.13），可以给已发布的版本重新生成镜像和离线包。
name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'android/**', 'windows/**', 'fnos/**']
  workflow_dispatch:
    inputs:
      tag:
        description: '要重新发布的版本标签，如 v2.0.13（留空只做构建测试）'
        required: false

permissions:
  contents: write   # 往 Release 上传离线镜像包
  packages: write   # 推镜像到 ghcr.io

env:
  IMAGE: ghcr.io/zyc009234/xerp
  HUB_USER: zyc009234xerp
  HUB_IMAGE: docker.io/zyc009234xerp/xerp
  # 要发布的版本标签：手动填的优先，其次是推送的 v* 标签；为空表示只测试不发布
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - name: 冒烟测试：构建本机架构镜像并跑起来
        run: |
          docker build -t xerp:test .
          docker run -d --name xerp-ci -p 8686:8686 -e XERP_STATS_URL= -e XERP_FEEDBACK_URL= -e XERP_ADMIN_PASSWORD=ci-pass-123 xerp:test
          for i in $(seq 30); do curl -sf http://127.0.0.1:8686/api/ping && break; sleep 1; done
          curl -sf http://127.0.0.1:8686/api/ping | grep -q '"app":"XERP"'
          curl -sf http://127.0.0.1:8686/ | grep -q '<title>'
          # 环境变量设的初始密码生效、默认密码不能登录
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"username":"admin","password":"ci-pass-123"}' http://127.0.0.1:8686/api/login | grep -q token
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}' http://127.0.0.1:8686/api/login)" = 401
          # 数据写在 /data，时区是北京时间
          docker exec xerp-ci ls /data/erp.db /data/config.json
          test "$(docker exec xerp-ci node -e 'console.log(new Date().getTimezoneOffset())')" = -480
          docker inspect --format '{{.State.Health.Status}}' xerp-ci
          docker rm -f xerp-ci

      - name: 版本号
        if: env.TAG != ''
        id: v
        run: echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: env.TAG != ''
      - uses: docker/setup-buildx-action@v3
        if: env.TAG != ''
      - uses: docker/login-action@v3
        if: env.TAG != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub：群晖 / 威联通 / 绿联 / 极空间的 Docker 界面搜索的都是 Docker Hub，推一份过去才搜得到
      - uses: docker/login-action@v3
        if: env.TAG != ''
        with:
          username: ${{ env.HUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.ZYC009234XERP }}

      - name: 推送多架构镜像到 ghcr.io 和 Docker Hub
        if: env.TAG != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.ver }}
            ${{ env.IMAGE }}:latest
            ${{ env.HUB_IMAGE }}:${{ steps.v.outputs.ver }}
            ${{ env.HUB_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Zyc009234/x.erp
            org.opencontainers.image.description=x.erp 轻量 ERP：进销存、财务、人事，数据留在自己的 NAS 里
            org.opencontainers.image.licenses=AGPL-3.0

      - name: 离线镜像包（国内拉不动 ghcr.io 时用 docker load 导入）
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.ver }}
        run: |
          set -euo pipefail
          # 每种架构单独导出（docker save 导不出非本机架构的镜像）；镜像名和 docker-compose.yml 里一致，导入后不用改配置
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" -t "$IMAGE:$VER" -t "$IMAGE:latest" \
              --output "type=docker,dest=xerp-$VER-docker-$arch.tar" .
            gzip -9 "xerp-$VER-docker-$arch.tar"
          done
          ls -lh xerp-*-docker-*.tar.gz
          # 检查离线包真能用：导入 amd64 包，跑起来能访问
          docker rmi -f "$IMAGE:$VER" "$IMAGE:latest" 2>/dev/null || true
          docker load -i "xerp-$VER-docker-amd64.tar.gz"
          docker run -d --name xerp-load -p 8687:8686 -e XERP_STATS_URL= -e XERP_FEEDBACK_URL= "$IMAGE:latest"
          for i in $(seq 30); do curl -sf http://127.0.0.1:8687/api/ping && break; sleep 1; done
          curl -sf http://127.0.0.1:8687/api/ping | grep -q "\"version\":\"$VER\""
          docker rm -f xerp-load
          # arm64 包至少要有镜像清单和像样的大小
          test "$(stat -c %s "xerp-$VER-docker-arm64.tar.gz")" -gt 10000000
          tar -tzf "xerp-$VER-docker-arm64.tar.gz" | grep -q manifest.json
          # Release 可能由本地脚本稍后才建好，等一会儿
          for i in $(seq 30); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$TAG" xerp-*-docker-*.tar.gz --clobber
