# Windows 安装包自动构建：
# - 推送 v* 标签或手动触发（填 tag 如 v2.14.2）时，在云端 Windows 打包 xerp-<版本>-windows-x64-setup.exe
# - 自动上传为对应 GitHub Release 的附件
name: windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布附件的版本标签（如 v2.14.2，留空只做构建测试）'
        required: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: 'x64'

      - name: 确保 Inno Setup 6 已安装
        shell: powershell
        run: |
          $iscc = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
          }

      - name: 打包 Windows 安装包
        shell: powershell
        run: .\windows\build-windows.ps1

      - name: 上传安装包到 GitHub Release
        if: env.TAG != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem dist\xerp-*-windows-x64-setup.exe | Select-Object -First 1
          if (-not $exe) { throw '未找到生成的 Windows 安装包' }
          gh release upload "$env:TAG" $exe.FullName --clobber
