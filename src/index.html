<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>x.erp</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<script src="vendor/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f4f6fb;--panel:#fff;--panel2:#f9fafb;--text:#1f2937;--muted:#6b7280;--border:#e8ebf2;
  --primary:#4f46e5;--primary-2:#6366f1;--primary-soft:#eef2ff;
  --green:#10b981;--green-soft:#ecfdf5;--orange:#f59e0b;--orange-soft:#fffbeb;
  --red:#ef4444;--red-soft:#fef2f2;--blue:#0ea5e9;--blue-soft:#f0f9ff;--purple:#8b5cf6;--purple-soft:#f5f3ff;
  --gray-soft:#f3f4f6;--sidebar:#0f172a;--sidebar-2:#1e293b;--sidebar-text:#94a3b8;
  --radius:14px;--shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.05);
}
[data-theme=dark]{
  --bg:#0b1020;--panel:#121a2f;--panel2:#0f1628;--text:#e5e7eb;--muted:#94a3b8;--border:#1f2a44;
  --primary-soft:#1e1b4b;--green-soft:#06281f;--orange-soft:#2d2006;--red-soft:#2d0f12;--blue-soft:#082235;
  --purple-soft:#221a3d;--gray-soft:#1b2438;--sidebar:#070b17;--sidebar-2:#121a2f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--text)}
a.link{color:var(--primary);cursor:pointer;font-weight:500;text-decoration:none}
a.link:hover{text-decoration:underline}

/* layout */
.app{display:flex;min-height:100vh}
.sidebar{width:236px;background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transition:width .2s,transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 18px;color:#fff;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#06b6d4);display:grid;place-items:center;font-weight:800;flex-shrink:0;box-shadow:0 4px 14px rgba(99,102,241,.45)}
nav{flex:1;overflow-y:auto;padding:4px 12px}
.nav-group{font-size:11px;letter-spacing:.08em;padding:16px 10px 6px;color:#64748b;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;margin:2px 0;cursor:pointer;white-space:nowrap;transition:.15s;position:relative}
.nav-item:hover{background:var(--sidebar-2);color:#e2e8f0}
.nav-item.on{background:linear-gradient(90deg,rgba(99,102,241,.25),rgba(99,102,241,.08));color:#fff}
.nav-item.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#818cf8}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:10px;padding:0 7px;line-height:18px}
.side-foot{padding:14px 20px;font-size:12px;color:#475569;white-space:nowrap;overflow:hidden}
.pro-tag{font-size:11px;margin-left:4px;vertical-align:1px}
#scanFab{display:none}
.native #scanFab{display:flex;position:fixed;right:18px;bottom:22px;z-index:9000;width:56px;height:56px;border-radius:50%;align-items:center;justify-content:center;background:var(--primary);color:#fff;box-shadow:0 6px 20px rgba(79,70,229,.45)}
.native #scanFab svg.i{width:26px;height:26px}
.native #scanFab:active{transform:scale(.94)}
.main{flex:1;margin-left:236px;min-width:0;transition:margin .2s}
.app.collapsed .sidebar{width:72px}
.app.collapsed .main{margin-left:72px}
.app.collapsed .nav-label,.app.collapsed .nav-group,.app.collapsed .brand-name,.app.collapsed .side-foot,.app.collapsed .nav-badge{display:none}
.app.collapsed .nav-item{justify-content:center}

.topbar{height:64px;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
.crumb{font-weight:600;font-size:16px;white-space:nowrap}
.crumb small{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);position:relative;transition:.15s}
.icon-btn:hover{background:var(--gray-soft);color:var(--text)}
.icon-btn.sm{width:30px;height:30px}
.dot{position:absolute;top:7px;right:7px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;padding:0 4px;display:none}
.gsearch{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:0 12px;height:38px;width:280px;color:var(--muted)}
.gsearch input{border:none;outline:none;background:none;flex:1;min-width:0}
.user{display:flex;align-items:center;gap:10px;padding-left:10px;margin-left:4px;border-left:1px solid var(--border)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#f472b6,#8b5cf6);color:#fff;display:grid;place-items:center;font-weight:600}
.user b{display:block;font-size:13px}.user small{color:var(--muted);font-size:12px}
.bell-wrap{position:relative}
.dropdown{position:absolute;right:0;top:46px;width:320px;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.15);display:none;overflow:hidden}
.dropdown.show{display:block}
.dd-head{padding:12px 16px;font-weight:600;border-bottom:1px solid var(--border)}
.dd-item{padding:10px 16px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px}
.dd-item:hover{background:var(--panel2)}
.dd-item small{color:var(--muted);display:block}
.content{padding:24px;max-width:1600px;margin:0 auto}

/* components */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:700}
.page-head p{color:var(--muted);margin-top:2px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}
.card-head h3{font-size:15px;font-weight:600}
.card-head .more{color:var(--muted);font-size:13px;cursor:pointer}
.card-head .more:hover{color:var(--primary)}
.card-body{padding:16px 20px 20px}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.g-2-1{grid-template-columns:2fr 1fr}
.mb{margin-bottom:16px}
.kpi{padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
.kpi-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.kpi-ic svg.i{width:22px;height:22px}
.kpi label{color:var(--muted);font-size:13px}
.kpi .v{font-size:22px;font-weight:700;margin:2px 0;letter-spacing:-.01em;white-space:nowrap}
.trend{font-size:12px;font-weight:500}
.trend.up{color:var(--green)}.trend.down{color:var(--red)}.trend span{color:var(--muted);font-weight:400}
.c-primary{background:var(--primary-soft);color:var(--primary)}.c-green{background:var(--green-soft);color:var(--green)}
.c-orange{background:var(--orange-soft);color:var(--orange)}.c-red{background:var(--red-soft);color:var(--red)}
.c-blue{background:var(--blue-soft);color:var(--blue)}.c-purple{background:var(--purple-soft);color:var(--purple)}

.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--border);background:var(--panel);font-weight:500;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.3)}
.btn.primary:hover{background:var(--primary-2);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn svg.i{width:16px;height:16px}
.tbtn{padding:3px 8px;border-radius:6px;color:var(--primary);font-size:13px;font-weight:500}
.tbtn:hover{background:var(--primary-soft)}
.tbtn.primary{background:var(--primary-soft)}
.tbtn.danger-text{color:var(--red)}.tbtn.danger-text:hover{background:var(--red-soft)}
.ops{display:flex;gap:2px;flex-wrap:wrap}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap}
.tb-left,.tb-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;padding:0 12px;height:36px;width:240px;background:var(--panel);color:var(--muted)}
.search input{border:none;outline:none;background:none;flex:1;min-width:0}
.search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.select{height:36px;border:1px solid var(--border);border-radius:9px;padding:0 10px;background:var(--panel);outline:none}

.table-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;white-space:nowrap}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;background:var(--panel2);padding:11px 16px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.tbl th.sortable{cursor:pointer;user-select:none}.tbl th.sortable:hover{color:var(--primary)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--border)}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr:hover{background:var(--panel2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl.compact td{padding:10px 16px}
.tbl.items td{padding:8px 10px}.tbl.items th{padding:9px 10px}
.tbl.items input,.tbl.items select{width:100%;height:34px;border:1px solid var(--border);border-radius:8px;padding:0 8px;background:var(--panel);outline:none}
.tbl.items input:focus,.tbl.items select:focus{border-color:var(--primary)}
.sub-t{color:var(--muted);font-size:12px}
.pager{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;color:var(--muted);font-size:13px}
.pager>div{display:flex;gap:4px}
.pg{min-width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--panel)}
.pg.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pg:disabled{opacity:.4;cursor:not-allowed}
.empty{text-align:center;padding:36px 0;color:var(--muted)}
.empty svg{width:64px;height:64px;opacity:.5;margin-bottom:6px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:500}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.plain::before{display:none}
.badge.green{background:var(--green-soft);color:var(--green)}.badge.orange{background:var(--orange-soft);color:var(--orange)}
.badge.red{background:var(--red-soft);color:var(--red)}.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.gray{background:var(--gray-soft);color:var(--muted)}.badge.purple{background:var(--purple-soft);color:var(--purple)}
.badge.primary{background:var(--primary-soft);color:var(--primary)}
.prog{display:flex;align-items:center;gap:8px;min-width:130px}
.prog .bar{flex:1;height:6px;background:var(--gray-soft);border-radius:4px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.prog small{color:var(--muted);font-size:12px;width:36px;text-align:right}
.pos{color:var(--green);font-weight:600}.neg{color:var(--red);font-weight:600}

.tabs{display:flex;gap:4px;padding:6px;background:var(--panel2);border:1px solid var(--border);border-radius:12px;width:fit-content;margin-bottom:16px}
.tab{padding:7px 16px;border-radius:8px;color:var(--muted);font-weight:500}
.tab.on{background:var(--panel);color:var(--primary);box-shadow:var(--shadow)}

.todo{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;cursor:pointer;transition:.15s;border:1px solid var(--border)}
.todo:hover{border-color:var(--primary);transform:translateY(-1px)}
.todo b{font-size:20px;display:block;line-height:1.2}
.todo small{color:var(--muted)}
.quick{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:12px;cursor:pointer;transition:.15s;font-size:13px}
.quick:hover{background:var(--panel2)}
.quick .kpi-ic{width:42px;height:42px}
.rank{display:flex;align-items:center;gap:12px;padding:8px 0}
.rank .no{width:22px;height:22px;border-radius:6px;background:var(--gray-soft);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.rank:nth-child(-n+3) .no{background:var(--primary);color:#fff}
.rank .nm{flex:1;min-width:0}
.rank .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .bar{height:5px;background:var(--gray-soft);border-radius:3px;margin-top:4px}
.rank .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#6366f1,#06b6d4)}
.chart-box{position:relative;height:280px}
.welcome{background:linear-gradient(120deg,#4f46e5,#7c3aed 55%,#06b6d4);color:#fff;border:none;padding:24px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;overflow:hidden;position:relative}
.welcome h2{font-size:21px}.welcome p{opacity:.85;margin-top:4px}
.welcome::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.welcome .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25);color:#fff;position:relative;z-index:1}
.welcome .btn:hover{background:rgba(255,255,255,.25)}

/* modal */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:6vh 16px;overflow-y:auto}
.modal-mask.show{display:flex}
.modal{background:var(--panel);border-radius:16px;width:560px;max-width:100%;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .18s ease-out}
.modal.lg{width:860px}.modal.sm{width:420px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border)}
.m-head h3{font-size:16px}
.m-body{padding:20px 22px;max-height:68vh;overflow-y:auto}
.m-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--border)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font-size:13px;color:var(--muted);font-weight:500}
.field i{color:var(--red);font-style:normal}
.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:9px;padding:8px 12px;background:var(--panel);outline:none;transition:.15s}
.field input,.field select{height:38px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.field input:disabled{background:var(--panel2);color:var(--muted)}
.field .err{border-color:var(--red)}
.span2{grid-column:span 2}
.line-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}
.o-total{text-align:right;margin-top:14px;color:var(--muted)}
.o-total b{font-size:22px;color:var(--primary);margin-left:8px}
.doc h2{text-align:center;font-size:20px;margin-bottom:4px}
.doc .doc-sub{text-align:center;color:var(--muted);margin-bottom:18px}
.doc-info{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;margin-bottom:16px;font-size:13px}
.doc-info span{color:var(--muted)}
.doc-sum{display:flex;justify-content:flex-end;gap:28px;margin-top:14px;font-size:13px}
.doc-sum b{font-size:16px}
.confirm-ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;margin-bottom:12px}

.toasts{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--panel);border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.15);border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:8px;animation:pop .2s;font-weight:500}
.toast.success svg{color:var(--green)}.toast.error svg{color:var(--red)}.toast.info svg{color:var(--blue)}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--border);gap:16px}
.setting-row:last-child{border-bottom:none}
.setting-row small{color:var(--muted);display:block}
.sr-group{display:flex;flex-direction:column;gap:6px}
.backdrop{display:none}
.login{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto;background:radial-gradient(circle at 15% 20%,rgba(99,102,241,.55) 0,transparent 45%),radial-gradient(circle at 85% 85%,rgba(6,182,212,.45) 0,transparent 45%),#0f172a}
.login.show{display:flex}
.login-card{width:410px;max-width:100%;background:var(--panel);border-radius:20px;padding:34px 32px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.login-card .logo{width:50px;height:50px;font-size:22px;color:#fff;margin-bottom:14px}
.login-card h2{font-size:22px}.login-card>p{color:var(--muted);margin:4px 0 22px}
.login-card .field{margin-bottom:14px}
.login-card .btn.primary{width:100%;justify-content:center;height:42px;margin-top:6px;font-size:15px}
.srv-state{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--muted);margin:-6px 0 14px}
.srv-state i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.srv-state.ok i{background:var(--green)}.srv-state.bad i{background:var(--red)}.srv-state.bad{color:var(--red)}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:0 8px;white-space:nowrap}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.conn.bad{color:var(--red)}.conn.bad i{background:var(--red)}
.user{cursor:pointer}
.loading-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#6366f1,#06b6d4);z-index:300;width:0;opacity:0;transition:width .4s,opacity .3s}
.loading-bar.on{width:75%;opacity:1}

.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.perm-box{border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.perm-box h4{font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.perm-box.off{opacity:.55}
.chk{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;font-size:13px}
.chk input{width:16px;height:16px;accent-color:var(--primary)}
.tpl-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:14px}
.slip-preview{border:1px solid var(--border);border-radius:10px;padding:18px;background:#fff;color:#000;overflow-x:auto}
.slip-preview table{border-collapse:collapse;width:100%}
.slip-preview th,.slip-preview td{border:1px solid #333;padding:4px 6px;font-size:12.5px}
.slip-preview .s-title{text-align:center}.slip-preview .s-title h1{font-size:18px}.slip-preview .s-title h2{font-size:15px;letter-spacing:.4em;margin:2px 0 8px}
.slip-preview .s-meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin:3px 0;flex-wrap:wrap}

const ic = n => `<svg class="i" viewBox="0 0 24 24">${ICONS[n] || ''}</svg>`;
const emptySvg = '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="10" y="18" width="44" height="34" rx="4"/><path d="M10 28h44M24 18l4-8h8l4 8"/><path d="M26 40h12"/></svg>';

/* ================= 常量 ================= */
const CATS = ['电子产品', '办公用品', '家居用品', '食品饮料'];
const UNITS = ['个', '台', '箱', '盒', '把', '张', '袋', '瓶', '件', '套'];
const cats = () => [...new Set([...CATS, ...db.products.map(p => p.category).filter(Boolean)])];
const units = () => [...new Set([...UNITS, ...db.products.map(p => p.unit).filter(Boolean)])];
const LEVELS = ['VIP', 'A级', 'B级', 'C级'];
const DEPTS = ['销售部', '采购部', '仓储部', '财务部', '行政部', '技术部'];
const METHODS = ['银行转账', '现金', '支付宝', '微信', '承兑汇票'];
const FIN_CATS = {income: ['销售收款', '其他收入', '投资收益', '退款'], expense: ['采购付款', '工资', '房租', '水电', '办公费', '差旅', '营销推广', '其他支出']};
const STATUS_COLOR = {'待发货':'orange','已发货':'blue','已完成':'green','已作废':'gray','待审核':'orange','已审核':'blue','已入库':'green','在职':'green','试用期':'blue','离职':'gray'};
const ORD = {
  sales:    {db:'sales', title:'销售订单', doc:'销售单', prefix:'SO', party:'customers', partyKey:'customerId', partyLabel:'客户', priceKey:'price', paidKey:'received', payWord:'收款', statuses:['待发货','已发货','已完成','已作废']},
  purchase: {db:'purchases', title:'采购订单', doc:'采购单', prefix:'PO', party:'suppliers', partyKey:'supplierId', partyLabel:'供应商', priceKey:'cost', paidKey:'paid', payWord:'付款', statuses:['待审核','已审核','已入库','已作废']}
};

/* ================= 服务端通信 ================= */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('erp_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('erp_' + k, JSON.stringify(v)); } catch (e) {} }
};
const prefs = Object.assign({theme:'light', pageSize:10}, LS.get('prefs', {}));
const NATIVE = window.XerpApp || null;  // 在 x.erp 安卓客户端里运行时，由客户端注入（扫码、保存文件、打印、切换服务器）
let db = {settings:{theme:prefs.theme, pageSize:prefs.pageSize}, products:[], customers:[], suppliers:[], employees:[], sales:[], purchases:[], stockLogs:[], stockDocs:[], checkDocs:[], finance:[], warehouses:[], transferDocs:[], batches:[]};
let ME = null, META = {modules:{}, perms:[], templates:{}, docTypes:{in:[], out:[]}, defaultWh:'w1', trialDays:15}, LIC = {pro:false, mode:'none'}, CLIENT_MODE = false, SERVER_ADDR = '', pending = 0, dataSig = '';
/* ---------- 专业版 / 仓库 / 批次 ---------- */
const isPro = () => !!LIC.pro;
const proTag = '<span class="badge purple plain pro-tag">专业版</span>';
// 未激活时点专业版功能：说明并引导到激活页
function proGate(feature) {
  if (isPro()) return true;
  confirmBox(`「${feature}」是专业版功能。可以先免费试用 ${META.trialDays} 天，或购买授权码激活；已有的数据不受影响。`, () => { ui.setTab = 'pro'; go('settings'); }, {title:'专业版功能', danger:false, okText:'去看看'});
  return false;
}
const whs = () => db.warehouses.length ? [...db.warehouses].sort((a, b) => (b.id === META.defaultWh) - (a.id === META.defaultWh) || String(a.code || '').localeCompare(String(b.code || ''))) : [{id:META.defaultWh, name:'主仓库'}];
const multiWh = () => db.warehouses.length > 1;
const whName = id => (byId(db.warehouses, id || META.defaultWh) || {}).name || '已删除仓库';
const whQty = (p, w) => !w ? p.stock : ((p.wh || {})[w] || 0);
const whOpts = (sel, all) => (all ? `<option value="">全部仓库</option>` : '') + whs().map(w => `<option value="${w.id}" ${w.id === sel ? 'selected' : ''}>${esc(w.name)}</option>`).join('');
const batchesOf = (pid, wh) => db.batches.filter(b => b.productId === pid && (!wh || b.wh === wh) && b.qty > 0);
const daysLeft = d => d ? daysBetween(today(), d) : null;
const expiryDays = () => +db.settings.expiryDays || 30;
const expState = b => { const n = daysLeft(b.expDate); return n == null ? ['无有效期', 'gray'] : n < 0 ? ['已过期', 'red'] : n <= expiryDays() ? [`${n} 天后到期`, 'orange'] : ['正常', 'green']; };
// 与服务端一致：未过期的先到期先出 → 无有效期 → 已过期；报损出库先出已过期的
const fefoSort = (a, b) => (a.expDate || '9999-12-31').localeCompare(b.expDate || '9999-12-31') || (a.inDate || '').localeCompare(b.inDate || '') || a.id.localeCompare(b.id);
function fefoOrder(list, kind) {
  const t = today(), bad = b => b.expDate && b.expDate < t;
  const ok = list.filter(b => !bad(b)).sort(fefoSort), exp = list.filter(bad).sort(fefoSort);
  return kind === '报损出库' ? [...exp, ...ok] : [...ok, ...exp];
}
const batchText = list => (list || []).map(b => `${b.no}${b.expDate ? '（至 ' + b.expDate + '）' : ''} × ${b.qty}`).join('；');
const isAdmin = () => !!ME && ME.role === 'admin';
const can = k => !!ME && (ME.perms || []).includes(k);
const canMoney = () => can('inv.cost');  // 出入库单上的价格与金额
const seesPrice = () => ['inv.cost', 'sales', 'purchase', 'finance', 'reports', 'dashboard'].some(can);  // 商品档案里的成本价 / 售价
function savePrefs() { prefs.theme = db.settings.theme; prefs.pageSize = db.settings.pageSize; LS.set('prefs', prefs); }
function busy(on) { pending += on ? 1 : -1; $('#lbar').classList.toggle('on', pending > 0); }
function setConn(ok) { const c = $('#conn'); c.classList.toggle('bad', !ok); c.querySelector('span').textContent = ok ? '已连接' : '连接中断'; }
async function api(method, path, body) {
  busy(true);
  try {
    let res;
    const headers = {'Content-Type':'application/json'}, token = LS.get('token');
    if (token) headers.Authorization = 'Bearer ' + token;
    try { res = await fetch(path, {method, headers, body:body === undefined ? undefined : JSON.stringify(body)}); }
    catch (e) { setConn(false); throw new Error('无法连接到服务器，请检查网络'); }
    let data = {};
    try { data = await res.json(); } catch (e) {}
    setConn(res.status !== 502);
    if (res.status === 401 && !path.endsWith('/login') && ME) { LS.set('token', null); ME = null; showLogin('登录已过期，请重新登录'); }
    if (!res.ok) throw new Error(data.error || '请求失败（' + res.status + '）');
    return data;
  } finally { busy(false); }
}
async function reload() {
  const d = await api('GET', '/api/data');
  ME = d.user; META = d.meta || META; LIC = d.license || LIC;
  const sig = JSON.stringify(d.data) + JSON.stringify(d.settings) + JSON.stringify(ME.perms) + JSON.stringify(LIC);
  const changed = sig !== dataSig; dataSig = sig;
  db = {warehouses:[], transferDocs:[], batches:[], ...d.data, settings:{...d.settings, version:d.version, releaseDate:d.releaseDate, theme:db.settings.theme, pageSize:db.settings.pageSize, user:ME.name}};
  return changed;
}
// 发起写操作 → 成功后重新拉取数据并刷新界面；失败则提示错误并保持弹窗
async function mutate(method, path, body, msg) {
  try {
    const r = await api(method, path, body);
    await reload(); closeModal();
    if (msg) toast(typeof msg === 'function' ? msg(r) : msg);
    render();
    return r || true;
  } catch (e) { toast(e.message, 'error'); return null; }
}

/* ---------- 登录 ---------- */
function showLogin(msg) {
  $('#login').classList.add('show');
  $('#lPass').value = '';
  if (msg) toast(msg, 'error');
  setTimeout(() => (CLIENT_MODE && !$('#lServer').value ? $('#lServer') : $('#lPass')).focus(), 50);
}
async function testServer() {
  const st = $('#srvState'), label = st.querySelector('span');
  st.className = 'srv-state'; label.textContent = '正在连接…';
  try {
    if (CLIENT_MODE) {
      const s = $('#lServer').value.trim();
      if (!s) throw new Error('请填写服务器地址');
      const r = await fetch('/local/config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({server:s})});
      const c = await r.json();
      if (!r.ok) throw new Error(c.error || '地址格式不正确');
      $('#lServer').value = SERVER_ADDR = c.server;
    }
    const r = await fetch('/api/ping'), d = await r.json().catch(() => ({}));
    if (!r.ok || d.app !== 'XERP') throw new Error(d.error || '该地址不是 x.erp 服务端');
    st.className = 'srv-state ok'; label.textContent = `连接成功 · ${d.company || ''} · v${d.version}`;
    return true;
  } catch (e) { st.className = 'srv-state bad'; label.textContent = e.message; return false; }
}
async function doLogin() {
  const btn = $('#lBtn'), user = $('#lUser').value.trim();
  if (!user || !$('#lPass').value) return toast('请输入用户名和密码', 'error');
  btn.disabled = true; btn.textContent = '登录中…';
  try {
    if (CLIENT_MODE && !(await testServer())) throw new Error('无法连接服务器，请检查服务器地址');
    const r = await api('POST', '/api/login', {username:user, password:$('#lPass').value});
    LS.set('token', r.token); LS.set('lastUser', user);
    await enterApp();
    toast('欢迎回来，' + ME.name);
  } catch (e) { toast(e.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = '登 录'; }
}
async function enterApp() {
  await reload();
  $('#login').classList.remove('show');
  applyTheme(); render();
}
async function boot() {
  applyTheme();
  try { const r = await fetch('/local/config'); if (r.ok) { CLIENT_MODE = true; SERVER_ADDR = (await r.json()).server || ''; } } catch (e) {}
  if (CLIENT_MODE) {
    $('#lServer').value = SERVER_ADDR;
    const beat = () => fetch('/local/heartbeat', {method:'POST'}).catch(() => {});
    beat(); setInterval(beat, 20000);
  } else { $('#srvBox').style.display = 'none'; SERVER_ADDR = location.origin; }
  $('#lUser').value = LS.get('lastUser', 'admin');
  if (LS.get('token')) { try { await enterApp(); return; } catch (e) { LS.set('token', null); } }
  showLogin();
}

/* ================= UI 基础 ================= */
let charts = [];
const ui = {}, lists = {};
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = ic(type === 'success' ? 'check' : type === 'error' ? 'alert' : 'info') + esc(msg);
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = '.3s'; el.style.opacity = 0; setTimeout(() => el.remove(), 300); }, 2400);
}
function openModal(html, size = '') { const m = $('#modal'); m.className = 'modal ' + size; m.innerHTML = html; $('#mask').classList.add('show'); }
function closeModal() { $('#mask').classList.remove('show'); $('#modal').innerHTML = ''; }
function modalHead(title) { return `<div class="m-head"><h3>${title}</h3><button class="icon-btn sm" data-act="closeModal">${ic('x')}</button></div>`; }
function confirmBox(msg, onOk, {title = '确认操作', danger = true, okText = '确定'} = {}) {
  openModal(`<div class="m-body" style="padding-top:26px"><div class="confirm-ic ${danger ? 'c-red' : 'c-primary'}">${ic(danger ? 'alert' : 'info')}</div><h3 style="margin-bottom:6px">${title}</h3><p style="color:var(--muted)">${msg}</p></div>
  <div class="m-foot"><button class="btn" data-act="closeModal">取消</button><button class="btn ${danger ? 'danger' : 'primary'}" id="cOk">${okText}</button></div>`, 'sm');
  $('#cOk').onclick = () => { closeModal(); onOk(); };
}
function fieldHtml(f, d) {
  const v = d[f.n] ?? f.def ?? '', dis = f.disabled ? 'disabled' : '';
  let input;
  if (f.type === 'select') {
    const opts = typeof f.opts === 'function' ? f.opts() : f.opts;
    input = `<select name="${f.n}" ${dis}>${opts.map(o => { const [a, b] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(a)}" ${String(a) === String(v) ? 'selected' : ''}>${esc(b)}</option>`; }).join('')}</select>`;
  } else if (f.type === 'combo') {
    const opts = typeof f.opts === 'function' ? f.opts() : f.opts;
    input = `<input name="${f.n}" list="dl-${f.n}" value="${esc(v)}" placeholder="${esc(f.ph || '')}" ${dis}><datalist id="dl-${f.n}">${opts.map(o => `<option value="${esc(o)}">`).join('')}</datalist>`;
  } else if (f.type === 'textarea') input = `<textarea name="${f.n}" rows="3" ${dis}>${esc(v)}</textarea>`;
  else input = `<input name="${f.n}" type="${f.type || 'text'}" value="${esc(v)}" ${f.type === 'number' ? 'step="any"' : ''} placeholder="${esc(f.ph || '')}" ${dis}>`;
  return `<label class="field ${f.span ? 'span2' : ''}"><span>${f.l}${f.req ? ' <i>*</i>' : ''}</span>${input}</label>`;
}
function readForm(fields) {
  const out = {};
  for (const f of fields) {
    if (f.disabled) continue;
    const el = document.querySelector(`#mform [name="${f.n}"]`);
    const v = el.value.trim();
    if (f.req && v === '') { el.classList.add('err'); el.focus(); toast('请填写' + f.l.replace(/（.*/, ''), 'error'); return null; }
    out[f.n] = f.type === 'number' ? (+v || 0) : v;
  }
  return out;
}
function formModal({title, fields, data = {}, onSubmit, okText = '保存'}) {
  openModal(`${modalHead(title)}<form id="mform" class="m-body form-grid" onsubmit="return false">${fields.map(f => fieldHtml(f, data)).join('')}</form>
  <div class="m-foot"><button class="btn" data-act="closeModal">取消</button><button class="btn primary" id="mOk">${okText}</button></div>`);
  $('#mOk').onclick = async () => {
    const v = readForm(fields); if (!v) return;
    const b = $('#mOk'); b.disabled = true;
    try { await onSubmit(v); } finally { b.disabled = false; }
  };
  const first = $('#mform input:not([disabled]),#mform select'); if (first) first.focus();
}
function exportCSV(name, headers, rows) {
  const csv = '﻿' + [headers, ...rows].map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\n');
  saveFile(name + '_' + today() + '.csv', 'text/csv', csv);
  if (!NATIVE) toast('已导出 ' + rows.length + ' 条记录');
}

/* ---------- 通用列表 ---------- */
function getState(key) { return ui[key] || (ui[key] = {q:'', page:1, f:{}, sort:null}); }
function toolbar(key, {placeholder = '搜索...', filters = [], buttons = ''} = {}) {
  const st = getState(key);
  return `<div class="toolbar"><div class="tb-left"><div class="search">${ic('search')}<input data-search="${key}" value="${esc(st.q)}" placeholder="${placeholder}"></div>
  ${filters.map(f => `<select class="select" data-filter="${key}|${f.key}"><option value="">${f.label}</option>${f.options.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${st.f[f.key] === v ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`).join('')}
  </div><div class="tb-right">${buttons}</div></div>`;
}
function mountList(key, cfg) { lists[key] = cfg; getState(key); renderList(key); }
function renderList(key) {
  const cfg = lists[key], el = document.getElementById('list-' + key);
  if (!cfg || !el) return;
  const st = getState(key), ps = +db.settings.pageSize || 10;
  let data = cfg.rows();
  if (st.q) { const q = st.q.trim().toLowerCase(); data = data.filter(r => cfg.search(r).toLowerCase().includes(q)); }
  (cfg.filters || []).forEach(f => { const v = st.f[f.key]; if (v) data = data.filter(r => f.test(r, v)); });
  if (st.sort) { const col = cfg.columns[st.sort.i]; if (col && col.s) data = [...data].sort((a, b) => { const x = col.s(a), y = col.s(b); return (x > y ? 1 : x < y ? -1 : 0) * st.sort.dir; }); }
  cfg.last = data;
  if (cfg.after) setTimeout(() => cfg.after(data));
  const total = data.length, pages = Math.max(1, Math.ceil(total / ps));
  if (st.page > pages) st.page = pages;
  const rows = data.slice((st.page - 1) * ps, st.page * ps);
  const head = cfg.columns.map((c, i) => `<th class="${c.cls || ''} ${c.s ? 'sortable' : ''}" ${c.s ? `data-act="sort" data-id="${key}|${i}"` : ''}>${c.t}${st.sort && st.sort.i === i ? (st.sort.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('');
  const body = rows.length ? rows.map(r => `<tr>${cfg.columns.map(c => `<td class="${c.cls || ''}">${c.r(r)}</td>`).join('')}</tr>`).join('')
    : `<tr><td colspan="${cfg.columns.length}"><div class="empty">${emptySvg}<p>${cfg.empty || '暂无数据'}</p></div></td></tr>`;
  let btns = ''; const s0 = Math.max(1, Math.min(st.page - 2, pages - 4)), e0 = Math.min(pages, s0 + 4);
  for (let i = s0; i <= e0; i++) btns += `<button class="pg ${i === st.page ? 'on' : ''}" data-act="page" data-id="${key}|${i}">${i}</button>`;
  el.innerHTML = `<div class="table-wrap"><table class="tbl ${cfg.compact ? 'compact' : ''}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
  ${cfg.noPager ? '' : `<div class="pager"><span>共 ${total} 条</span><div><button class="pg" data-act="page" data-id="${key}|${st.page - 1}" ${st.page <= 1 ? 'disabled' : ''}>‹</button>${btns}<button class="pg" data-act="page" data-id="${key}|${st.page + 1}" ${st.page >= pages ? 'disabled' : ''}>›</button></div></div>`}`;
}
function exportList(key) {
  const cfg = lists[key]; if (!cfg || !cfg.exp) return;
  exportCSV(cfg.exp.name, cfg.exp.cols.map(c => c[0]), (cfg.last || cfg.rows()).map(r => cfg.exp.cols.map(c => c[1](r))));
}
const tbtn = (label, act, id, cls = '') => `<button class="tbtn ${cls}" data-act="${act}" data-id="${esc(id)}">${label}</button>`;
const kpi = (label, value, icon, color, extra = '') => `<div class="card kpi"><div class="kpi-ic c-${color}">${ic(icon)}</div><div style="min-width:0"><label>${label}</label><div class="v">${value}</div>${extra}</div></div>`;
function trendHtml(cur, prev) {
  if (!prev) return '<div class="trend"><span>上月无数据</span></div>';
  const p = (cur - prev) / Math.abs(prev) * 100;
  return `<div class="trend ${p >= 0 ? 'up' : 'down'}">${p >= 0 ? '↑' : '↓'} ${Math.abs(p).toFixed(1)}% <span>较上月</span></div>`;
}
const pageHead = (title, desc, right = '') => `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div><div class="tb-right">${right}</div></div>`;
const tabs = (key, items) => `<div class="tabs">${items.map(([v, l]) => `<button class="tab ${ui[key] === v ? 'on' : ''}" data-act="tab" data-id="${key}|${v}">${l}</button>`).join('')}</div>`;

function catStats(orders) {
  const r = {};
  orders.forEach(o => o.items.forEach(i => { const p = byId(db.products, i.productId); const c = p ? p.category : '其他'; r[c] = (r[c] || 0) + i.qty * i.price; }));
  return r;
}

}

function rmbUpper(v) {
  const D = '零壹贰叁肆伍陆柒捌玖', cents = Math.round(Math.abs(+v || 0) * 100), jiao = Math.floor(cents / 10) % 10, fen = cents % 10;
  let n = Math.floor(cents / 100), out = '';
  const frac = (jiao ? D[jiao] + '角' : fen && n ? '零' : '') + (fen ? D[fen] + '分' : '');
  if (!n) return (v < 0 ? '负' : '') + (frac || '零元整');
  const s = frac || '整';
  const big = ['元', '万', '亿'], small = ['', '拾', '佰', '仟'];
  for (let i = 0; i < big.length && n > 0; i++) {
    let p = '';
    for (let j = 0; j < small.length && n > 0; j++) { p = D[n % 10] + small[j] + p; n = Math.floor(n / 10); }
    out = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + big[i] + out;
  }
  out = out.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零');
  return (v < 0 ? '负' : '') + out + s;
}

// 打印一份完整的 HTML：浏览器里用隐藏 iframe；安卓客户端里交给系统打印
function printHtml(title, html) {
  if (NATIVE) return NATIVE.print(title, html);
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  const d = f.contentDocument;
  d.open(); d.write(html); d.close();
  setTimeout(() => { f.contentWindow.focus(); f.contentWindow.print(); setTimeout(() => f.remove(), 1500); }, 200);
}
// 保存文件：浏览器里直接下载；安卓客户端里让用户选保存位置
function saveFile(name, mime, data) {
  if (NATIVE) {
    const bytes = typeof data === 'string' ? new TextEncoder().encode(data) : new Uint8Array(data);
    let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return NATIVE.saveFile(name, mime, btoa(bin));
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type:mime}));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- 收发存汇总 / 明细账 ---------- */
const logAsc = (a, b) => (a.date + (a.time || '') + a.id).localeCompare(b.date + (b.time || '') + b.id);
function logsByProduct() {
  const g = {};
  db.stockLogs.forEach(l => { (g[l.productId] = g[l.productId] || []).push(l); });
  Object.values(g).forEach(a => a.sort(logAsc));
  return g;
}
// 期末结存 = 当前库存 − 截止日之后的变动；期初 = 期末 − 期间净变动（不依赖历史流水是否完整）
// 金额：入 / 出按流水上的计价单价；期初 / 期末按当时的移动加权单位成本
// wh：只统计该仓库（含调拨进出）；不传则统计全部仓库，此时调拨只是仓库间移动，不计入收发
const isTransferLog = l => l.kind === '调拨出库' || l.kind === '调拨入库' || (l.kind === '作废冲回' && /^DB/.test(l.ref || ''));
const logWh = l => l.wh || META.defaultWh;
function stockSummary(from, to, wh = '') {
  const g = logsByProduct();
  return db.products.map(p => {
    let after = 0, inQ = 0, outQ = 0, inA = 0, outA = 0, costBegin = null, costEnd = null;
    for (const l of g[p.id] || []) {
      if (wh && logWh(l) !== wh) { if (l.costAfter != null && l.date <= to) { if (l.date < from) costBegin = l.costAfter; costEnd = l.costAfter; } continue; }
      if (l.date > to) { after += l.qty; continue; }
      const c = l.cost ?? p.cost ?? 0;
      if (l.date >= from) { if (!wh && isTransferLog(l)) { /* 仓库间移动 */ } else if (l.qty > 0) { inQ += l.qty; inA += l.qty * c; } else { outQ -= l.qty; outA -= l.qty * c; } }
      else if (l.costAfter != null) costBegin = l.costAfter;
      if (l.costAfter != null) costEnd = l.costAfter;
    }
    // 全部仓库时，期间内的调拨进出相互抵消，不影响期初期末
    const endQ = whQty(p, wh) - after, beginQ = endQ - inQ + outQ;
    return {p, beginQ, inQ, outQ, endQ, beginA:beginQ * (costBegin ?? costEnd ?? p.cost ?? 0), inA, outA, endA:endQ * (costEnd ?? p.cost ?? 0)};
  });
}
function monthRange(offset) { const d = new Date(), a = new Date(d.getFullYear(), d.getMonth() + offset, 1), b = new Date(d.getFullYear(), d.getMonth() + offset + 1, 0); return [fmtDate(a), offset ? fmtDate(b) : today()]; }

    ${multiWh() ? `<select class="select" id="ssWh">${whOpts(ui.ssWh || '', true)}</select>` : ''}</div></div>`
    + toolbar('ss', {placeholder:'搜索编码 / 商品 / 规格', filters, buttons:btns}) + '<div id="ssTotal" style="padding:0 20px 12px"></div><div id="list-ss"></div>';
  const cell = (q, a) => `${num(q)}${mo ? `<div class="sub-t">${money(a)}</div>` : ''}`;
  mountList('ss', {rows:() => ui.ssRows, search:r => r.p.sku + r.p.name + (r.p.spec || ''), filters, columns:[
    {t:'商品', r:r => `<a class="link" data-act="ledger" data-id="${r.p.id}">${esc(r.p.name)}</a><div class="sub-t">${esc(r.p.sku)}${r.p.spec ? ' · ' + esc(r.p.spec) : ''}</div>`, s:r => r.p.sku},
    {t:'单位', r:r => esc(r.p.unit)},

function ledger(pid) {

function transferModal() {

    <div class="line-head"><b>调拨商品</b><span class="sub-t" style="margin-left:10px;margin-right:auto">可输入编码 / 条码 / 名称，支持扫码枪；批次商品按先到期先出带过去</span><button class="btn sm" id="tAdd">${ic('plus')}添加一行</button></div>
    <datalist id="tProdList">${db.products.map(p => `<option value="${esc(prodLabel(p))}">`).join('')}</datalist>
    <div class="table-wrap"><table class="tbl items"><thead><tr><th style="min-width:230px">商品</th><th style="width:60px">单位</th><th class="num" style="width:90px">调出仓库存</th><th class="num" style="width:90px">调入仓库存</th><th style="width:100px">数量</th><th style="width:160px">备注</th><th style="width:44px"></th></tr></thead><tbody id="tItems"></tbody></table></div>
    <label class="field" style="margin-top:16px"><span>备注</span><textarea id="tRemark" rows="2"></textarea></label>
    <div class="o-total">合计数量<b id="tQty">0</b></div></div>
    <div class="m-foot"><button class="btn" data-act="closeModal">取消</button><button class="btn" id="tSave">保存</button>${can('inv.print') ? `<button class="btn primary" id="tSavePrint">${ic('printer')}保存并打印</button>` : ''}</div>`, 'lg');
  const tb = $('#tItems');
  const renderRows = focusLast => {
    tb.innerHTML = draft.items.map((it, i) => { const p = it.productId && byId(db.products, it.productId); return `<tr>
      <td><input list="tProdList" data-i="${i}" data-k="product" value="${p ? esc(prodLabel(p)) : ''}" placeholder="编码 / 条码 / 名称"></td><td>${p ? esc(p.unit) : ''}</td>

    $('#tQty').textContent = num(sum(draft.items.filter(i => i.productId), i => +i.qty || 0));
    if (focusLast) { const ins = tb.querySelectorAll('[data-k=product]'); ins[ins.length - 1].focus(); }
  };
  const pick = (i, v) => {
    const p = findProduct(v);
    if (!p) { if (v) toast('未找到商品：' + v, 'error'); draft.items[i].productId = ''; renderRows(); return; }
    const dup = draft.items.findIndex((x, k) => k !== i && x.productId === p.id);
    if (dup >= 0) { draft.items[dup].qty = (+draft.items[dup].qty || 0) + 1; draft.items[i] = blank(); renderRows(true); return toast(p.name + ' 已在明细中，数量 +1', 'info'); }
    draft.items[i].productId = p.id;

    const items = draft.items.filter(i => i.productId);

    if (!items.length) return toast('请至少添加一个商品', 'error');
    if (items.some(i => !Number.isInteger(+i.qty) || +i.qty <= 0)) return toast('数量必须为正整数', 'error');
    const need = {}; items.forEach(i => { need[i.productId] = (need[i.productId] || 0) + +i.qty; });
    const lack = Object.entries(need).map(([pid, q]) => ({p:byId(db.products, pid), q})).filter(x => whQty(x.p, draft.from) < x.q);
    if (lack.length) return toast(whName(draft.from) + '库存不足：' + lack.map(x => `${x.p.name}（需 ${x.q}，现有 ${whQty(x.p, draft.from)}）`).join('、'), 'error');

// 消耗 = 统计期内的销售出库、领料等出库（不含调拨、盘亏、作废冲回）
const CONSUME = l => l.qty < 0 && !isTransferLog(l) && !['盘亏', '作废冲回', '盘点调整'].includes(l.kind);
function replenishRows(o) {
  const from = fmtDate(new Date(Date.now() - o.days * 864e5));
  const used = {}; db.stockLogs.forEach(l => { if (CONSUME(l) && l.date > from && (!o.wh || logWh(l) === o.wh)) used[l.productId] = (used[l.productId] || 0) - l.qty; });
  const onOrder = {}; db.purchases.filter(p => ['待审核', '已审核'].includes(p.status)).forEach(po => po.items.forEach(i => { onOrder[i.productId] = (onOrder[i.productId] || 0) + i.qty; }));
  const lastBuy = {}; [...db.purchases].filter(p => p.status !== '已作废').sort((a, b) => a.date.localeCompare(b.date)).forEach(po => po.items.forEach(i => { lastBuy[i.productId] = {sup:po.supplierId, price:i.price}; }));
  return db.products.map(p => {
    const stock = whQty(p, o.wh), daily = (used[p.id] || 0) / o.days, inbound = o.wh ? 0 : onOrder[p.id] || 0;
    const target = Math.ceil(daily * (o.lead + o.cover)) + (p.safety || 0);
    const need = Math.max(0, target - stock - inbound);
    return {p, stock, daily, inbound, target, need, cover:daily ? stock / daily : null, sup:(lastBuy[p.id] || {}).sup || '', price:(lastBuy[p.id] || {}).price ?? p.cost ?? 0};
  }).filter(r => r.need > 0).sort((a, b) => (a.cover ?? 1e9) - (b.cover ?? 1e9));
}

// Code 128：全数字且偶数位用 C 码集（更短），否则用 B 码集（ASCII 32~126）
const C128 = '212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112'.split(' ');
function code128(text) {
  text = String(text);
  if (!/^[\x20-\x7e]+$/.test(text)) return null;
  const codes = /^\d+$/.test(text) && text.length % 2 === 0 && text.length >= 4 ? [105, ...text.match(/\d\d/g).map(Number)] : [104, ...[...text].map(c => c.charCodeAt(0) - 32)];
  codes.push(codes.reduce((s, c, i) => s + c * (i || 1), 0) % 103, 106);
  return codes.map(c => C128[c]).join('');
}

  [...pat].forEach((w, i) => { if (i % 2 === 0) bars += `<rect x="${x}" y="0" width="${w}" height="${h}"/>`; x += +w; });
  return `<svg viewBox="0 0 ${x + 10} ${h}" preserveAspectRatio="none" style="width:100%;height:100%;display:block" fill="#000">${bars}</svg>`;
}

const IMPORT_COLS = [['sku', '商品编码', ['编码', 'sku', '货号', '商品编号', '物料编码']], ['name', '商品名称', ['名称', '品名', '物料名称']], ['spec', '规格型号', ['规格', '型号']],
  ['category', '分类', ['商品分类', '类别']], ['unit', '单位', ['计量单位']], ['cost', '成本价', ['成本', '进价', '期初成本', '期初单价']], ['price', '销售价', ['售价', '零售价']],
  ['stock', '期初库存', ['期初数量', '库存', '数量', '库存数量']], ['safety', '安全库存', ['最低库存', '库存下限']], ['remark', '备注', []]];
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok, bad) => {
    const s = document.createElement('script');
    s.src = 'vendor/xlsx.full.min.js';
    s.onload = () => ok(window.XLSX); s.onerror = () => { s.remove(); bad(new Error('Excel 组件加载失败，请刷新页面重试，或把表格另存为 CSV 再导入')); };
    document.head.appendChild(s);
  });
}
function parseCSV(t) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; } else if (c !== '\r') cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
async function readSheet(file) {
  if (/\.csv$/i.test(file.name)) {
    const buf = await file.arrayBuffer();
    let t = new TextDecoder('utf-8').decode(buf);
    if (t.includes('�')) t = new TextDecoder('gbk').decode(buf);  // Excel 另存的 CSV 常是 GBK
    return parseCSV(t.replace(/^﻿/, ''));
  }
  const X = await loadXLSX(), wb = X.read(await file.arrayBuffer());
  return X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''});
}
function sheetToRows(aoa) {
  const norm = s => String(s ?? '').replace(/[\s*＊()（）]/g, '').toLowerCase();
  const hi = aoa.findIndex(r => r.some(c => IMPORT_COLS[0][2].concat(IMPORT_COLS[0][1]).map(norm).includes(norm(c))));
  if (hi < 0) throw new Error('没找到表头，第一行需要包含「商品编码」列，建议下载模板填写');
  const map = {};
  aoa[hi].forEach((h, i) => { const col = IMPORT_COLS.find(([, l, al]) => [l, ...al].map(norm).includes(norm(h))); if (col && !(col[0] in map)) map[col[0]] = i; });
  // _row：在表格里的实际行号，报错时好定位
  return aoa.slice(hi + 1).map((r, j) => { const o = {}; for (const [k, i] of Object.entries(map)) { const v = r[i]; o[k] = typeof v === 'string' ? v.trim() : v; } return [o, hi + 2 + j]; })
    .filter(([o]) => Object.values(o).some(v => v !== '' && v != null)).map(([o, n]) => ({...o, _row:n}));
}
async function downloadTemplate() {
  const head = IMPORT_COLS.map(c => c[1]), demo = [['A1001', '示例商品一', '500ml', '食品饮料', '瓶', 3.5, 6, 120, 20, ''], ['A1002', '示例商品二', 'M10×30', '五金配件', '个', 0.2, 0.5, 1000, 200, '']];
  try {
    const X = await loadXLSX(), ws = X.utils.aoa_to_sheet([head, ...demo]), wb = X.utils.book_new();
    ws['!cols'] = head.map(() => ({wch:12}));
    X.utils.book_append_sheet(wb, ws, '商品');
    if (NATIVE) saveFile('商品导入模板.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', X.write(wb, {type:'array', bookType:'xlsx'}));
    else X.writeFile(wb, '商品导入模板.xlsx');
  } catch (e) { exportCSV('商品导入模板', head, demo); toast('Excel 组件不可用，已下载 CSV 模板', 'info'); }
}

function importPreview(rows, update, fileName) {

  const bySku = new Map(db.products.map(p => [p.sku, p])), seen = new Set(), pr = seesPrice();
  const isNum = (v, int) => v === '' || v == null || (Number.isFinite(+v) && +v >= 0 && (!int || Number.isInteger(+v)));
  const checked = rows.map(r => {
    const sku = String(r.sku ?? '').trim(), ex = bySku.get(sku), msg = [];
    if (!sku) msg.push('编码为空'); else if (seen.has(sku)) msg.push('编码重复'); seen.add(sku);
    if (!ex && !String(r.name ?? '').trim()) msg.push('新商品缺少名称');
    [['cost', '成本价'], ['price', '销售价']].forEach(([k, l]) => { if (!isNum(r[k])) msg.push(l + '不正确'); });
    [['stock', '期初库存'], ['safety', '安全库存']].forEach(([k, l]) => { if (!isNum(r[k], true)) msg.push(l + '须为非负整数'); });
    const st = msg.length ? '错误' : ex ? (update ? '更新' : '跳过') : '新增';
    if (ex && !msg.length && r.stock !== '' && r.stock != null && +r.stock !== ex.stock) msg.push('已有商品不改库存（当前 ' + ex.stock + '）');
    return {r, st, msg:msg.join('；')};
  });
  const cnt = k => checked.filter(x => x.st === k).length, errs = cnt('错误');
  openModal(`${modalHead('导入预览 · ' + esc(fileName))}<div class="m-body" style="padding-top:12px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${badge('新增 ' + cnt('新增'), 'green')}${badge('更新 ' + cnt('更新'), 'blue')}${cnt('跳过') ? badge('跳过 ' + cnt('跳过'), 'gray') : ''}${errs ? badge('错误 ' + errs, 'red') : ''}
      <span class="sub-t">共 ${rows.length} 行${rows.length > 300 ? '，下表只显示前 300 行' : ''}${!pr ? '；你没有查看价格的权限，价格列不会导入' : ''}</span></div>
    <div class="table-wrap" style="max-height:52vh;overflow:auto"><table class="tbl compact"><thead><tr><th>行</th><th>结果</th><th>编码</th><th>名称</th><th>规格</th><th>分类</th><th>单位</th>${pr ? '<th class="num">成本价</th><th class="num">销售价</th>' : ''}<th class="num">期初库存</th><th class="num">安全库存</th><th>说明</th></tr></thead><tbody>
    ${checked.slice(0, 300).map(x => `<tr><td class="sub-t">${x.r._row}</td><td>${badge(x.st, {新增:'green', 更新:'blue', 跳过:'gray', 错误:'red'}[x.st])}</td><td>${esc(x.r.sku)}</td><td>${esc(x.r.name)}</td><td>${esc(x.r.spec)}</td><td>${esc(x.r.category)}</td><td>${esc(x.r.unit)}</td>
      ${pr ? `<td class="num">${esc(x.r.cost)}</td><td class="num">${esc(x.r.price)}</td>` : ''}<td class="num">${esc(x.r.stock)}</td><td class="num">${esc(x.r.safety)}</td><td class="${x.st === '错误' ? 'neg' : 'sub-t'}">${esc(x.msg)}</td></tr>`).join('')}
    </tbody></table></div></div>
    <div class="m-foot"><button class="btn" style="margin-right:auto" data-act="importOpen">重新选择</button><button class="btn" data-act="closeModal">取消</button>
    <button class="btn primary" id="imGo" ${errs ? 'disabled title="请先修正表格中的错误"' : ''}>确认导入</button></div>`, 'lg');

function orderOps(kind, o) {

function orderAct(action, kind, id) {
  const C = ORD[kind], o = byId(db[C.db], id), url = `/api/orders/${kind}/${id}`;
  const run = (act, msg, body) => mutate(act === 'delete' ? 'DELETE' : 'POST', act === 'delete' ? url : url + '/' + act, body || {}, msg);
  if (action === 'ship') {
    const need = {}; o.items.forEach(i => { need[i.productId] = (need[i.productId] || 0) + i.qty; });
    const lackIn = w => Object.entries(need).map(([pid, q]) => ({p:byId(db.products, pid), q})).filter(x => !x.p || whQty(x.p, w) < x.q);
    const lackMsg = (w, l) => (multiWh() ? whName(w) : '') + '库存不足：' + l.map(x => (x.p ? x.p.name + '（缺 ' + (x.q - whQty(x.p, w)) + '）' : '商品已删除')).join('、');
    if (!multiWh()) {
      const lack = lackIn(META.defaultWh);
      if (lack.length) return toast(lackMsg(META.defaultWh, lack), 'error');
      return confirmBox(`确认发货 ${o.no}？将扣减对应商品库存。`, () => run('ship', '已发货，库存已扣减'), {danger:false, okText:'确认发货'});
    }
    const best = whs().find(w => !lackIn(w.id).length);
    formModal({title:'发货 · ' + o.no, okText:'确认发货', data:{wh:(best || whs()[0]).id}, fields:[{n:'wh', l:'从哪个仓库发货', type:'select', opts:whs().map(w => [w.id, w.name + (lackIn(w.id).length ? '（库存不足）' : '')]), span:1}],
      onSubmit:v => { const l = lackIn(v.wh); if (l.length) return toast(lackMsg(v.wh, l), 'error'); return run('ship', '已从' + whName(v.wh) + '发货，库存已扣减', {wh:v.wh}); }});
  } else if (action === 'complete') run('complete', '订单已完成');
  else if (action === 'approve') confirmBox(`审核通过采购单 ${o.no}？`, () => run('approve', '审核通过'), {danger:false, okText:'审核通过'});
  else if (action === 'inbound') {
    const bItems = o.items.filter(i => (byId(db.products, i.productId) || {}).batch);
    if (!multiWh() && !bItems.length) return confirmBox(`确认采购单 ${o.no} 全部到货入库？`, () => run('inbound', '已入库，库存已增加'), {danger:false, okText:'确认入库'});
    openModal(`${modalHead('采购入库 · ' + o.no)}<div class="m-body">
      ${multiWh() ? `<label class="field"><span>入库仓库 <i>*</i></span><select id="ibWh">${whOpts(META.defaultWh)}</select></label>` : ''}
      ${bItems.length ? `<div class="line-head"><b>批次信息</b><span class="sub-t" style="margin-left:10px">批号留空则用采购单号</span></div>
      <div class="table-wrap"><table class="tbl items"><thead><tr><th>商品</th><th class="num">数量</th><th>批号</th><th>生产日期</th><th>有效期至</th></tr></thead><tbody>
      ${bItems.map(i => { const p = byId(db.products, i.productId); return `<tr data-pid="${p.id}"><td><b>${esc(p.name)}</b>${p.shelfDays ? `<div class="sub-t">保质期 ${p.shelfDays} 天</div>` : ''}</td><td class="num">${i.qty}</td>
        <td><input data-k="no" placeholder="${esc(o.no)}"></td><td><input type="date" data-k="prodDate"></td><td><input type="date" data-k="expDate"></td></tr>`; }).join('')}</tbody></table></div>` : ''}
      <p class="sub-t" style="margin-top:10px">确认后采购单全部数量入库。</p></div>
      <div class="m-foot"><button class="btn" data-act="closeModal">取消</button><button class="btn primary" id="ibOk">确认入库</button></div>`, bItems.length ? 'lg' : '');
    $('#ibOk').onclick = () => {
      const batches = {};
      document.querySelectorAll('#modal tr[data-pid]').forEach(tr => { const g = k => tr.querySelector(`[data-k=${k}]`).value.trim(); batches[tr.dataset.pid] = {no:g('no'), prodDate:g('prodDate'), expDate:g('expDate')}; });
      const bad = Object.entries(batches).find(([, b]) => b.prodDate && b.expDate && b.expDate < b.prodDate);
      if (bad) return toast(`「${byId(db.products, bad[0]).name}」有效期早于生产日期`, 'error');
      const wh = $('#ibWh') ? $('#ibWh').value : META.defaultWh;
      run('inbound', '已入库' + (multiWh() ? '到' + whName(wh) : '') + '，库存已增加', {wh, batches});
    };
  }
  else if (action === 'cancel') confirmBox(`确定作废单据 ${o.no} 吗？`, () => run('cancel', '已作废'));
  else if (action === 'orderDel') confirmBox(`确定删除单据 ${o.no} 吗？此操作不可撤销。`, () => run('delete', '已删除'));
  else if (action === 'pay') {
    const unpaid = unpaidOf(kind, o);
    formModal({title:'登记' + C.payWord + ' · ' + o.no, okText:'确认' + C.payWord, fields:[
      {n:'amount', l:`${C.payWord}金额（未结 ${money(unpaid)}）`, type:'number', req:1}, {n:'date', l:'日期', type:'date', req:1},
      {n:'method', l:'方式', type:'select', opts:METHODS}, {n:'note', l:'备注'}],
      data:{amount:unpaid, date:today(), method:'银行转账'}, onSubmit:v => {
        if (v.amount <= 0 || v.amount > unpaid + 0.001) return toast('金额需在 0 ~ ' + money(unpaid) + ' 之间', 'error');
        return run('pay', C.payWord + '已登记：' + money(v.amount), v);
      }});
  }
}

/* ================= 页面：报表 ================= */
function pageReports() {
  if (!ui.rptN) ui.rptN = 6;
  const months = lastMonths(ui.rptN), S = validSales();
  const stats = months.map(mk => {
    const so = S.filter(o => monthKey(o.date) === mk), po = db.purchases.filter(o => o.status !== '已作废' && monthKey(o.date) === mk);
    const sales = sum(so, orderTotal), cost = sum(so, orderCost), gp = sales - cost;
    const exp = sum(db.finance.filter(f => f.type === 'expense' && f.category !== '采购付款' && monthKey(f.date) === mk), f => f.amount);
    return {mk, count:so.length, sales, cost, gp, rate:sales ? gp / sales * 100 : 0, purchase:sum(po, orderTotal), exp, net:gp - exp};
  });
  const inRange = S.filter(o => months.includes(monthKey(o.date)));
  const pAmt = {}, cAmt = {};
  inRange.forEach(o => { cAmt[o.customerId] = (cAmt[o.customerId] || 0) + orderTotal(o); o.items.forEach(i => { pAmt[i.productId] = pAmt[i.productId] || {amt:0, qty:0, gp:0}; pAmt[i.productId].amt += i.qty * i.price; pAmt[i.productId].qty += i.qty; pAmt[i.productId].gp += i.qty * (i.price - (i.cost || 0)); }); });
  const topP = Object.entries(pAmt).sort((a, b) => b[1].amt - a[1].amt).slice(0, 10);
  const topC = Object.entries(cAmt).sort((a, b) => b[1] - a[1]).slice(0, 8), cMax = topC[0] ? topC[0][1] : 1;
  const T = {sales:sum(stats, s => s.sales), gp:sum(stats, s => s.gp), exp:sum(stats, s => s.exp), net:sum(stats, s => s.net)};
  ui.rptStats = stats;
  $('#view').innerHTML = pageHead('统计报表', '经营数据多维度分析', `<select class="select" id="rptN"><option value="3" ${ui.rptN == 3 ? 'selected' : ''}>近 3 个月</option><option value="6" ${ui.rptN == 6 ? 'selected' : ''}>近 6 个月</option><option value="12" ${ui.rptN == 12 ? 'selected' : ''}>近 12 个月</option></select><button class="btn" data-act="rptExport">${ic('download')}导出报表</button>`) + `
  <div class="grid g4 mb">
    ${kpi('销售总额', moneyK(T.sales), 'sales', 'primary', `<div class="trend"><span>${inRange.length} 笔订单</span></div>`)}
    ${kpi('毛利总额', moneyK(T.gp), 'coin', 'green', `<div class="trend"><span>毛利率 ${T.sales ? (T.gp / T.sales * 100).toFixed(1) : 0}%</span></div>`)}
    ${kpi('运营费用', moneyK(T.exp), 'wallet', 'orange')}
    ${kpi('净利润', `<span class="${T.net >= 0 ? 'pos' : 'neg'}">${moneyK(T.net)}</span>`, 'chart', 'purple')}
  </div>
  <div class="grid g-2-1 mb">
    <div class="card"><div class="card-head"><h3>销售与利润趋势</h3></div><div class="card-body"><div class="chart-box"><canvas id="r1"></canvas></div></div></div>
    <div class="card"><div class="card-head"><h3>客户销售排行</h3></div><div class="card-body">
      ${topC.map(([cid, v]) => `<div class="rank"><span class="no"></span><div class="nm"><div>${esc((byId(db.customers, cid) || {}).name || '已删除')}</div><div class="bar"><i style="width:${v / cMax * 100}%"></i></div></div><b>${moneyK(v)}</b></div>`).join('') || '<div class="empty">暂无数据</div>'}
    </div></div>
  </div>
  <div class="grid g2 mb">
    <div class="card"><div class="card-head"><h3>商品销售 TOP 10</h3></div><div class="card-body"><div class="chart-box" style="height:320px"><canvas id="r2"></canvas></div></div></div>
    <div class="card"><div class="card-head"><h3>品类销售对比</h3></div><div class="card-body"><div class="chart-box" style="height:320px"><canvas id="r3"></canvas></div></div></div>
  </div>
  <div class="card"><div class="card-head"><h3>月度经营明细</h3></div><div class="card-body" style="padding:12px 0 0"><div class="table-wrap"><table class="tbl">
    <thead><tr><th>月份</th><th class="num">订单数</th><th class="num">销售额</th><th class="num">销售成本</th><th class="num">毛利</th><th class="num">毛利率</th><th class="num">采购额</th><th class="num">运营费用</th><th class="num">净利润</th></tr></thead>
    <tbody>${stats.map(s => `<tr><td>${s.mk}</td><td class="num">${s.count}</td><td class="num">${money(s.sales)}</td><td class="num">${money(s.cost)}</td><td class="num">${money(s.gp)}</td><td class="num">${s.rate.toFixed(1)}%</td><td class="num">${money(s.purchase)}</td><td class="num">${money(s.exp)}</td><td class="num ${s.net >= 0 ? 'pos' : 'neg'}">${money(s.net)}</td></tr>`).join('')}
    <tr style="font-weight:700;background:var(--panel2)"><td>合计</td><td class="num">${sum(stats, s => s.count)}</td><td class="num">${money(T.sales)}</td><td class="num">${money(sum(stats, s => s.cost))}</td><td class="num">${money(T.gp)}</td><td class="num">${T.sales ? (T.gp / T.sales * 100).toFixed(1) : 0}%</td><td class="num">${money(sum(stats, s => s.purchase))}</td><td class="num">${money(T.exp)}</td><td class="num ${T.net >= 0 ? 'pos' : 'neg'}">${money(T.net)}</td></tr></tbody>
  </table></div></div></div>`;
  $('#rptN').onchange = e => { ui.rptN = +e.target.value; render(); };
  chart('r1', {data:{labels:months.map(mLabel), datasets:[
    {type:'bar', label:'销售额', data:stats.map(s => s.sales), backgroundColor:'#6366f1', borderRadius:6, maxBarThickness:30},
    {type:'line', label:'毛利', data:stats.map(s => s.gp), borderColor:'#10b981', backgroundColor:'#10b981', tension:.35},
    {type:'line', label:'净利润', data:stats.map(s => s.net), borderColor:'#f59e0b', backgroundColor:'#f59e0b', tension:.35, borderDash:[5, 4]}
  ]}, options:{scales:{y:yMoney, x:{grid:{display:false}}}}});
  chart('r2', {type:'bar', data:{labels:topP.map(([pid]) => (byId(db.products, pid) || {}).name || '已删除'), datasets:[{label:'销售额', data:topP.map(x => x[1].amt), backgroundColor:'#06b6d4', borderRadius:5}, {label:'毛利', data:topP.map(x => x[1].gp), backgroundColor:'#a5b4fc', borderRadius:5}]}, options:{indexAxis:'y', scales:{x:yMoney, y:{grid:{display:false}}}}});
  const cat = catStats(inRange);
  chart('r3', {type:'polarArea', data:{labels:Object.keys(cat), datasets:[{data:Object.values(cat), backgroundColor:PALETTE.map(c => c + 'cc'), borderWidth:0}]}, options:{scales:{r:{ticks:{display:false}}}}});
}
