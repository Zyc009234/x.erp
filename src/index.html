      <button class="btn sm" type="button" data-all="1">全选</button><button class="btn sm" type="button" data-all="0">清空</button></div>
    <div class="perm-grid">${Object.entries(groups).map(([m, ps]) => `<div class="perm-box ${mods.includes(m) ? '' : 'off'}"><h4>${esc(META.modules[m])}${mods.includes(m) ? '' : '<span class="badge gray plain">模块未启用</span>'}</h4>
      ${ps.map(([k, l]) => `<label class="chk"><input type="checkbox" name="perm" value="${k}" ${cur.has(k) ? 'checked' : ''}>${esc(l)}</label>`).join('')}</div>`).join('')}</div></div>`);
  const box = $('#permBox'), boxes = () => box.querySelectorAll('input[name=perm]');
  $('#permFrom').onchange = e => { const src = ROLES.find(x => x.id === e.target.value); if (src) { const s = new Set(src.perms); boxes().forEach(x => { x.checked = s.has(x.value); }); } };
  box.addEventListener('click', e => { const b = e.target.closest('[data-all]'); if (b) boxes().forEach(x => { x.checked = b.dataset.all === '1'; }); });
  // 勾选任一库存 / 商品操作时自动带上对应的「查看」，否则看不到页面
  box.addEventListener('change', e => {
    const k = e.target.value;
    if (e.target.checked && k.startsWith('inv.') && k !== 'inv.view') box.querySelector('[value="inv.view"]').checked = true;
    if (e.target.checked && k.startsWith('prod.') && k !== 'prod.view') box.querySelector('[value="prod.view"]').checked = true;
  });
}

/* ================= 外壳：导航 / 主题 / 提醒 / 搜索 ================= */
const NAV = [
  {id:'dashboard', label:'工作台', icon:'dashboard', fn:pageDashboard, perm:'dashboard'},
  {group:'业务管理'},
  {id:'inventory', label:'库存管理', icon:'warehouse', fn:pageInventory, badge:() => lowStock().length, perm:'inv.view'},
  {id:'products', label:'商品管理', icon:'box', fn:pageProducts, perm:'prod.view'},
  {id:'sales', label:'销售管理', icon:'sales', fn:() => pageOrders('sales'), badge:() => db.sales.filter(o => o.status === '待发货').length, perm:'sales'},
  {id:'purchase', label:'采购管理', icon:'cart', fn:() => pageOrders('purchase'), badge:() => db.purchases.filter(o => o.status === '待审核').length, perm:'purchase'},
  {group:'往来单位'},
  {id:'customers', label:'客户管理', icon:'users', fn:() => pageParty('customers'), perm:'parties'},
  {id:'suppliers', label:'供应商管理', icon:'truck', fn:() => pageParty('suppliers'), perm:'parties'},
  {group:'运营管理'},
  {id:'finance', label:'财务管理', icon:'wallet', fn:pageFinance, perm:'finance'},
  {id:'employees', label:'人事管理', icon:'id', fn:pageEmployees, perm:'hr'},
  {id:'reports', label:'统计报表', icon:'chart', fn:pageReports, perm:'reports'},
  {group:'系统'},
  {id:'settings', label:'系统设置', icon:'settings', fn:pageSettings}
];
const PAGES = Object.fromEntries(NAV.filter(n => n.id).map(n => [n.id, n]));
const visiblePage = n => !n.perm || can(n.perm);
const current = () => { const p = location.hash.replace('#/', ''); return PAGES[p] && visiblePage(PAGES[p]) ? p : (NAV.find(n => n.id && visiblePage(n)) || PAGES.settings).id; };
function go(p) { if (location.hash === '#/' + p) render(); else location.hash = '#/' + p; }
function applyTheme() {
  const t = db.settings.theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : db.settings.theme;
  document.documentElement.dataset.theme = t;
  $('#themeBtn').innerHTML = ic(t === 'dark' ? 'sun' : 'moon');
}
function render() {
  if (!ME) return;
  charts.forEach(c => c.destroy()); charts = [];
  const p = current(), page = PAGES[p];
  // 分组标题只在组内有可见菜单时显示
  const vis = NAV.filter((n, i) => {
    if (!n.group) return visiblePage(n);
    for (let j = i + 1; j < NAV.length && !NAV[j].group; j++) if (visiblePage(NAV[j])) return true;
    return false;
  });
  $('#nav').innerHTML = vis.map(n => n.group ? `<div class="nav-group">${n.group}</div>`
    : `<div class="nav-item ${n.id === p ? 'on' : ''}" data-act="go" data-id="${n.id}" title="${n.label}">${ic(n.icon)}<span class="nav-label">${n.label}</span>${n.badge && n.badge() ? `<span class="nav-badge">${n.badge()}</span>` : ''}</div>`).join('');
  $('#crumb').innerHTML = `${page.label}<small>${esc(db.settings.company)}</small>`;
  $('#userName').textContent = ME.name; $('#avatar').textContent = ME.name.slice(0, 1);
  $('#userRole').textContent = isAdmin() ? '系统管理员' : (ME.roleName || '操作员');
  page.fn();
  updateBell();
  $('#app').classList.remove('open');
}
function updateBell() {
  const low = can('inv.view') ? lowStock() : [], ship = can('sales') ? db.sales.filter(o => o.status === '待发货') : [], appr = can('purchase') ? db.purchases.filter(o => o.status === '待审核') : [];
  const exps = can('inv.view') ? db.batches.filter(b => b.qty > 0 && b.expDate && daysLeft(b.expDate) <= expiryDays()) : [], expired = exps.filter(b => daysLeft(b.expDate) < 0);
  const n = low.length + (ship.length ? 1 : 0) + (appr.length ? 1 : 0) + (exps.length ? 1 : 0);
  const dot = $('#bellDot'); dot.style.display = n ? 'block' : 'none'; dot.textContent = n;
  $('#bellDrop').innerHTML = `<div class="dd-head">消息提醒（${n}）</div>
    ${exps.length ? `<div class="dd-item" data-act="goBatches"><span class="badge red plain">保质期</span><div>${expired.length ? expired.length + ' 个批次已过期，' : ''}${exps.length - expired.length} 个批次 ${expiryDays()} 天内到期<small>点击查看批次库存</small></div></div>` : ''}
    ${ship.length ? `<div class="dd-item" data-act="goFilter" data-id="sales|status|待发货"><span class="badge orange plain">订单</span><div>${ship.length} 个销售订单待发货<small>请尽快安排出库</small></div></div>` : ''}
    ${appr.length ? `<div class="dd-item" data-act="goFilter" data-id="purchase|status|待审核"><span class="badge purple plain">审核</span><div>${appr.length} 个采购订单待审核<small>点击前往处理</small></div></div>` : ''}
    ${low.slice(0, 6).map(p => `<div class="dd-item" ${can('inv.in') ? `data-act="stock" data-id="in|${p.id}"` : 'data-act="go" data-id="inventory"'}><span class="badge red plain">库存</span><div>${esc(p.name)} 库存不足<small>当前 ${p.stock}，安全库存 ${p.safety}${can('inv.in') ? '，点击开入库单' : ''}</small></div></div>`).join('')}
    ${n ? '' : '<div class="empty">暂无新消息</div>'}`;
}
function globalSearch(q) {
  q = q.trim().toLowerCase(); if (!q) return;
  const hit = s => String(s).toLowerCase().includes(q);
  const so = can('sales') ? db.sales.filter(o => hit(o.no) || hit(partyName('sales', o))).slice(0, 6) : [];
  const po = can('purchase') ? db.purchases.filter(o => hit(o.no) || hit(partyName('purchase', o))).slice(0, 6) : [];
  const pr = db.products.filter(p => hit(p.name) || hit(p.sku) || hit(p.barcode || '') || hit(p.spec || '')).slice(0, 6);
  const cu = can('parties') ? db.customers.filter(c => hit(c.name) || hit(c.contact) || hit(c.phone)).slice(0, 6) : [];
  const sd = db.stockDocs.filter(o => hit(o.no) || hit(o.party)).slice(0, 6);
  const sec = (title, arr, f) => arr.length ? `<h4 style="margin:14px 0 6px;color:var(--muted);font-size:12px">${title}</h4>${arr.map(f).join('')}` : '';
  const row = (act, id, main, sub) => `<div class="dd-item" style="border-radius:8px;border:none" data-act="${act}" data-id="${id}"><div>${main}<small>${sub}</small></div></div>`;
  const html = sec('出入库单', sd, o => row('docView', o.id, o.no, o.type + ' · ' + esc(o.party || '-') + ' · ' + o.date + ' · ' + o.status))
    + sec('销售订单', so, o => row('orderView', 'sales|' + o.id, o.no, partyName('sales', o) + ' · ' + money(orderTotal(o)) + ' · ' + o.status))
    + sec('采购订单', po, o => row('orderView', 'purchase|' + o.id, o.no, partyName('purchase', o) + ' · ' + money(orderTotal(o)) + ' · ' + o.status))
    + sec('商品', pr, p => row(can('prod.edit') ? 'edit' : 'prodLogs', can('prod.edit') ? 'products|' + p.id : p.id, esc(p.name), esc(p.sku) + ' · 库存 ' + p.stock))
    + sec('客户', cu, c => row('edit', 'customers|' + c.id, esc(c.name), esc(c.contact) + ' · ' + esc(c.phone)));
  openModal(`${modalHead('搜索：' + esc(q))}<div class="m-body" style="padding-top:6px">${html || `<div class="empty">${emptySvg}<p>未找到相关结果</p></div>`}</div>`);
}

/* ================= 事件分发 ================= */
const split = v => String(v).split('|');
const A = {
  closeModal, go,
  toggleSide: () => { const app = $('#app'); if (innerWidth <= 768) app.classList.toggle('open'); else app.classList.toggle('collapsed'); },
  toggleTheme: () => { db.settings.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; savePrefs(); applyTheme(); render(); },
  toggleBell: () => $('#bellDrop').classList.toggle('show'),
  goFilter: v => { const [page, f, val] = split(v); const st = getState(page); st.f = {[f]:val}; st.q = ''; st.page = 1; $('#bellDrop').classList.remove('show'); closeModal(); go(page); },
  page: v => { const [k, n] = split(v); getState(k).page = +n; renderList(k); },
  sort: v => { const [k, i] = split(v), st = getState(k); st.sort = st.sort && st.sort.i === +i ? {i:+i, dir:-st.sort.dir} : {i:+i, dir:1}; renderList(k); },
  tab: v => { const [k, t] = split(v); ui[k] = t; render(); },
  export: exportList,
  add: t => editEntity(t),
  edit: v => { const [t, id] = split(v); closeModal(); editEntity(t, id); },
  del: v => delEntity(...split(v)),
  stock: v => { const [m, id] = split(v); $('#bellDrop').classList.remove('show'); stockModal(m, id); },
  prodLogs: id => { closeModal(); prodLogs(id); },
  docNew: dir => docModal(dir),
  scrap: pid => docModal('out', pid, '报损出库'),
  docView: id => { closeModal(); docView(id); },
  docPrint: id => docPrint(id),
  docVoid: id => { closeModal(); docVoid(id); },
  printCheck,
  checkNew, checkOpen:id => { closeModal(); checkOpen(id); }, checkPrint, checkVoid,
  importOpen:() => { closeModal(); importOpen(); },
  ssPrint, ledger:id => { closeModal(); ledger(id); },
  nativeServer: () => NATIVE && NATIVE.changeServer(),
  goPro: () => { closeModal(); ui.setTab = 'pro'; go('settings'); },
  goBatches: () => { $('#bellDrop').classList.remove('show'); ui.invTab = 'batch'; const st = getState('batches'); st.f = {}; go('inventory'); },
  licActivate: () => { const key = $('#licKey').value.replace(/\s+/g, ''); if (!key) return toast('请粘贴授权码', 'error'); mutate('POST', '/api/license', {key}, r => r.pro ? '专业版已激活，感谢支持！' : '授权码已保存：' + (r.note || '')); },
  licTrial: () => confirmBox(`开始 ${META.trialDays} 天免费试用？每套系统只能试用一次，试用结束后已建的仓库、批次数据照常保留。`, () => mutate('POST', '/api/license/trial', {}, `专业版试用已开始，${META.trialDays} 天后结束`), {title:'免费试用专业版', danger:false, okText:'开始试用'}),
  licRemove: () => confirmBox('移除授权码后专业版功能将不可用（数据不受影响）。确定移除？', () => mutate('DELETE', '/api/license', undefined, '已移除授权')),
  whManage, whEdit: id => { closeModal(); whEdit(id); }, whDel: id => { closeModal(); whDel(id); },
  transferNew: () => transferModal(), transferView: id => { closeModal(); transferView(id); }, transferPrint: id => transferPrint(id), transferVoid: id => { closeModal(); transferVoid(id); },
  expirySave: () => mutate('PUT', '/api/settings/expiry', {days:+$('#expDays').value}, '临期提醒天数已保存'),
  labelOpen,
  repCalc: () => { ui.rep = {days:Math.max(7, +$('#rDays').value || 30), lead:Math.max(0, +$('#rLead').value || 0), cover:Math.max(1, +$('#rCover').value || 14), wh:$('#rWh') ? $('#rWh').value : ''}; render(); },
  repGen,
  repExport: () => { const pk = Object.fromEntries(repPicked().map(x => [x.pid, x])); exportCSV('补货建议', ['商品编码', '商品', '当前库存', '安全库存', '日均出库', '在途', '建议补货', '供应商'],
    ui.repRows.map(r => [r.p.sku, r.p.name, r.stock, r.p.safety, r.daily.toFixed(2), r.inbound, pk[r.p.id] ? pk[r.p.id].qty : r.need, ((byId(db.suppliers, pk[r.p.id] && pk[r.p.id].sup || r.sup)) || {}).name || ''])); },
  ssRange:v => { const d = new Date(); [ui.ssFrom, ui.ssTo] = v === 'y' ? [d.getFullYear() + '-01-01', today()] : monthRange(+v); render(); },
  saveModules: () => {
    const modules = [...document.querySelectorAll('input[name=mod]:checked')].map(x => x.value);
    if (!modules.length) return toast('至少启用一个模块', 'error');
    mutate('PUT', '/api/settings', {modules}, '模块设置已保存');
  },
  partyOrders: v => { const [t, id] = split(v); const page = t === 'customers' ? 'sales' : 'purchase'; const st = getState(page); st.f = {party:id}; st.q = ''; st.page = 1; go(page); },
  orderNew: k => orderModal(k),
  orderEdit: v => { const [k, id] = split(v); closeModal(); orderModal(k, id); },
  orderView: v => orderView(...split(v)),
  // 订单详情打印整页（页面的 @media print 只留单据区域）；安卓客户端把当前页面去掉脚本后交给系统打印
  print: () => NATIVE ? printHtml('单据', document.documentElement.outerHTML.replace(/<script[\s\S]*?<\/script>/gi, '')) : window.print(),
  finAdd,
  finDel: id => confirmBox('确定删除这条收支记录吗？', () => mutate('DELETE', '/api/finance/' + id, undefined, '已删除')),
  rptExport: () => exportCSV('月度经营报表', ['月份', '订单数', '销售额', '销售成本', '毛利', '毛利率%', '采购额', '运营费用', '净利润'], ui.rptStats.map(s => [s.mk, s.count, s.sales.toFixed(2), s.cost.toFixed(2), s.gp.toFixed(2), s.rate.toFixed(1), s.purchase.toFixed(2), s.exp.toFixed(2), s.net.toFixed(2)])),
  savePrefs: () => { db.settings.theme = $('#sTheme').value; db.settings.pageSize = +$('#sPs').value; savePrefs(); applyTheme(); toast('偏好已保存'); render(); },
  saveCompany: () => mutate('PUT', '/api/settings', {company:$('#sCompany').value.trim()}, '公司名称已保存'),
  changePwd: () => formModal({title:'修改密码', okText:'确认修改', fields:[
    {n:'old', l:'当前密码', type:'password', req:1}, {n:'pwd', l:'新密码（至少 6 位）', type:'password', req:1}, {n:'pwd2', l:'确认新密码', type:'password', req:1}],
    onSubmit:async v => {
      if (v.pwd.length < 6) return toast('新密码至少 6 位', 'error');
      if (v.pwd !== v.pwd2) return toast('两次输入的新密码不一致', 'error');
      try { await api('POST', '/api/password', {oldPassword:v.old, newPassword:v.pwd}); closeModal(); toast('密码已修改'); } catch (e) { toast(e.message, 'error'); }
    }}),
  logout: () => confirmBox('确定退出登录吗？', async () => {
    try { await api('POST', '/api/logout', {}); } catch (e) {}
    LS.set('token', null); ME = null; showLogin();
  }, {danger:false, okText:'退出'}),
  userEdit: id => userEdit(id),
  roleEdit: id => roleEdit(id),
  roleCopy: id => roleEdit(id, true),
  roleDel: id => { const r = ROLES.find(x => x.id === id); confirmBox(r.users ? `还有 ${r.users} 个账号使用「${esc(r.name)}」，请先给他们换角色。` : `确定删除角色「${esc(r.name)}」吗？`, () => { if (!r.users) mutate('DELETE', '/api/roles/' + id, undefined, '角色已删除'); }, r.users ? {title:'无法删除', danger:false, okText:'知道了'} : {}); },
  userDel: id => { const u = USERS.find(x => x.id === id); confirmBox(`确定删除用户「${esc(u.name)}（${esc(u.username)}）」吗？`, () => mutate('DELETE', '/api/users/' + id, undefined, '用户已删除')); },
  backup: async () => {
    try {
      const d = await api('GET', '/api/backup');
      saveFile('erp_backup_' + today() + '.json', 'application/json', JSON.stringify(d, null, 2));
      if (!NATIVE) toast('备份已导出');
    } catch (e) { toast(e.message, 'error'); }
  },
  restore: () => $('#importFile').click(),
  reset: () => confirmBox('将用演示数据覆盖服务器上的全部业务数据，所有用户都会受影响，确定继续？', () => mutate('POST', '/api/reset-demo', {}, '已重置为演示数据')),
  clearAll: () => confirmBox('将删除服务器上的所有业务数据（保留用户账号和系统设置），此操作不可撤销！', () => mutate('POST', '/api/clear', {}, '数据已清空'), {title:'危险操作', okText:'确认清空'})
};
['ship', 'complete', 'approve', 'inbound', 'cancel', 'orderDel', 'pay'].forEach(a => { A[a] = v => { const [k, id] = split(v); orderAct(a, k, id); }; });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!e.target.closest('.bell-wrap')) $('#bellDrop').classList.remove('show');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset.id, el); }
});
document.addEventListener('input', e => { const k = e.target.dataset.search; if (k) { const st = getState(k); st.q = e.target.value; st.page = 1; renderList(k); } });
document.addEventListener('change', e => { const f = e.target.dataset.filter; if (f) { const [k, fk] = split(f); getState(k).f[fk] = e.target.value; getState(k).page = 1; renderList(k); } });
$('#mask').addEventListener('mousedown', e => { if (e.target.id === 'mask') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('#gsearch').addEventListener('keydown', e => { if (e.key === 'Enter') globalSearch(e.target.value); });
$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    e.target.value = '';
    let d;
    try { d = JSON.parse(r.result); } catch (err) { return toast('导入失败：文件不是有效的 JSON', 'error'); }
    confirmBox('导入将覆盖服务器上的全部业务数据，确定继续？', () => mutate('POST', '/api/restore', d, '导入成功'));
  };
  r.readAsText(file);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (db.settings.theme === 'auto') { applyTheme(); render(); } });
window.addEventListener('hashchange', render);

/* ================= 安卓客户端：扫码按钮 / 返回键 / 切换服务器 ================= */
if (NATIVE) {
  document.documentElement.classList.add('native');
  // 记住最后一个获得焦点的输入框：扫码结果填进去并模拟扫码枪的回车
  const SCAN_INPUT = 'input:not([type=checkbox]):not([type=radio]):not([type=date]):not([type=file]):not([type=password]),textarea';
  let lastInput = null;
  document.addEventListener('focusin', e => { if (e.target.matches(SCAN_INPUT)) lastInput = e.target; });
  const fab = document.createElement('button');
  fab.id = 'scanFab'; fab.type = 'button'; fab.title = '扫码'; fab.innerHTML = ic('barcode');
  ['pointerdown', 'mousedown'].forEach(t => fab.addEventListener(t, e => e.preventDefault()));  // 不抢输入框的焦点
  fab.addEventListener('click', () => {
    if (!ME) return toast('请先登录', 'error');
    const a = document.activeElement;
    if (a && a.matches(SCAN_INPUT)) lastInput = a;
    else if ($('#mask').classList.contains('show') && lastInput && !lastInput.closest('#modal')) lastInput = null;  // 弹窗开着时不往背后的页面里填
    NATIVE.scan();
  });
  document.body.appendChild(fab);
  window.__xerpScanResult = code => {
    code = String(code || '').trim(); if (!code) return;
    const el = lastInput && lastInput.isConnected && lastInput.offsetParent !== null ? lastInput : null;
    if (el) {
      el.focus(); el.value = code;
      el.dispatchEvent(new Event('input', {bubbles:true}));
      el.dispatchEvent(new Event('change', {bubbles:true}));
      if (el.isConnected) el.dispatchEvent(new KeyboardEvent('keydown', {key:'Enter', bubbles:true}));
      return;
    }
    // 没有正在填的输入框：按条码 / 编码直接找商品
    const p = findProduct(code);
    if (p && can('inv.view')) { prodLogs(p.id); toast(p.name + ' · 当前库存 ' + p.stock, 'info'); }
    else globalSearch(code);
  };
  // 返回键：先关弹窗、下拉、侧栏，处理了返回 true
  window.__xerpBack = () => {
    if ($('#mask').classList.contains('show')) { closeModal(); return true; }
    if ($('#bellDrop').classList.contains('show')) { $('#bellDrop').classList.remove('show'); return true; }
    if ($('#app').classList.contains('open')) { $('#app').classList.remove('open'); return true; }
    return false;
  };
  $('#lBtn').insertAdjacentHTML('afterend', `<p style="text-align:center;margin-top:14px;font-size:13px"><span class="sub-t">服务器 ${esc(NATIVE.server().replace(/^https?:\/\//, ''))}</span> · <a class="link" data-act="nativeServer">切换</a></p>`);
}

$('#lBtn').onclick = doLogin;
$('#srvTest').onclick = testServer;
boot();
</script>
