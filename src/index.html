  const docAppr = can('inv.approve') ? db.stockDocs.filter(o => o.status === '待审核') : [], rejected = db.stockDocs.filter(o => o.status === '已驳回' && o.creatorId === ME.id);
  const n = low.length + (ship.length ? 1 : 0) + (appr.length ? 1 : 0) + (exps.length ? 1 : 0) + (docAppr.length ? 1 : 0) + (rejected.length ? 1 : 0);
  const dot = $('#bellDot'); dot.style.display = n ? 'block' : 'none'; dot.textContent = n;
  $('#bellDrop').innerHTML = `<div class="dd-head">消息提醒（${n}）</div>
    ${exps.length ? `<div class="dd-item" data-act="goBatches"><span class="badge red plain">保质期</span><div>${expired.length ? expired.length + ' 个批次已过期，' : ''}${exps.length - expired.length} 个批次 ${expiryDays()} 天内到期<small>点击查看批次库存</small></div></div>` : ''}
    ${docAppr.length ? `<div class="dd-item" data-act="goPendingDocs"><span class="badge purple plain">审核</span><div>${docAppr.length} 张出入库单待审核<small>审核通过后才改库存，点击前往处理</small></div></div>` : ''}
    ${rejected.length ? `<div class="dd-item" data-act="docView" data-id="${rejected[0].id}"><span class="badge red plain">驳回</span><div>${rejected.length} 张出入库单被驳回<small>${esc(rejected[0].no)}：${esc(rejected[0].rejectReason || '')}</small></div></div>` : ''}
    ${ship.length ? `<div class="dd-item" data-act="goFilter" data-id="sales|status|待发货"><span class="badge orange plain">订单</span><div>${ship.length} 个销售订单待发货<small>请尽快安排出库</small></div></div>` : ''}
    ${appr.length ? `<div class="dd-item" data-act="goFilter" data-id="purchase|status|待审核"><span class="badge purple plain">审核</span><div>${appr.length} 个采购订单待审核<small>点击前往处理</small></div></div>` : ''}
    ${low.slice(0, 6).map(p => `<div class="dd-item" ${can('inv.in') ? `data-act="stock" data-id="in|${p.id}"` : 'data-act="go" data-id="inventory"'}><span class="badge red plain">库存</span><div>${esc(p.name)} 库存不足<small>当前 ${p.stock}，安全库存 ${p.safety}${can('inv.in') ? '，点击开入库单' : ''}</small></div></div>`).join('')}
    ${n ? '' : '<div class="empty">暂无新消息</div>'}`;
}
function globalSearch(q) {
  q = q.trim().toLowerCase(); if (!q) return;
  const hit = s => String(s).toLowerCase().includes(q);
  const so = can('sales') ? db.sales.filter(o => hit(o.no) || hit(partyName('sales', o))).slice(0, 6) : [];
  const po = can('purchase') ? db.purchases.filter(o => hit(o.no) || hit(partyName('purchase', o))).slice(0, 6) : [];
  const pr = db.products.filter(p => hit(p.name) || hit(p.sku) || hit(p.barcode || '') || hit(p.spec || '')).slice(0, 6);
  const cu = can('parties') ? db.customers.filter(c => hit(c.name) || hit(c.contact) || hit(c.phone)).slice(0, 6) : [];
  const sd = db.stockDocs.filter(o => hit(o.no) || hit(o.party)).slice(0, 6);
  const sn = db.serials.filter(r => hit(r.sn)).slice(0, 6);
  const sh = db.shipments.filter(s => hit(s.trackNo)).slice(0, 6);
  const sec = (title, arr, f) => arr.length ? `<h4 style="margin:14px 0 6px;color:var(--muted);font-size:12px">${title}</h4>${arr.map(f).join('')}` : '';
  const row = (act, id, main, sub) => `<div class="dd-item" style="border-radius:8px;border:none" data-act="${act}" data-id="${id}"><div>${main}<small>${sub}</small></div></div>`;
  const html = sec('快递运单', sh, s => row('shipView', s.id, esc(s.trackNo), esc(carrierLabel(s.carrierId)) + ' · ' + esc(s.province) + ' · ' + (s.srcNo ? esc(s.srcNo) + ' · ' : '') + s.status))
    + sec('序列号', sn, r => row('snView', r.id, esc(r.sn), esc(prodOf(r.productId).name) + ' · ' + r.status + (r.status === '在库' ? ' · ' + esc(whName(r.wh)) : '')))
    + sec('出入库单', sd, o => row('docView', o.id, o.no, o.type + ' · ' + esc(o.party || '-') + ' · ' + o.date + ' · ' + o.status))
    + sec('销售订单', so, o => row('orderView', 'sales|' + o.id, o.no, partyName('sales', o) + ' · ' + money(orderTotal(o)) + ' · ' + o.status))
    + sec('采购订单', po, o => row('orderView', 'purchase|' + o.id, o.no, partyName('purchase', o) + ' · ' + money(orderTotal(o)) + ' · ' + o.status))
    + sec('商品', pr, p => row(can('prod.edit') ? 'edit' : 'prodLogs', can('prod.edit') ? 'products|' + p.id : p.id, esc(p.name), esc(p.sku) + ' · 库存 ' + p.stock))
    + sec('客户', cu, c => row('edit', 'customers|' + c.id, esc(c.name), esc(c.contact) + ' · ' + esc(c.phone)));
  openModal(`${modalHead('搜索：' + esc(q))}<div class="m-body" style="padding-top:6px">${html || `<div class="empty">${emptySvg}<p>未找到相关结果</p></div>`}</div>`);
}

/* ================= 事件分发 ================= */

  expirySave: () => mutate('PUT', '/api/settings/expiry', {days:+$('#expDays').value}, '临期提醒天数已保存'),

  repCalc: () => { ui.rep = {days:Math.max(7, +$('#rDays').value || 30), lead:Math.max(0, +$('#rLead').value || 0), cover:Math.max(1, +$('#rCover').value || 14), wh:$('#rWh') ? $('#rWh').value : '', round:$('#rRound').checked}; render(); },

    ui.repRows.map(r => [r.p.sku, r.p.name, r.stock, r.p.safety, r.daily.toFixed(2), r.inbound, pk[r.p.id] ? pk[r.p.id].qty : r.need, ((byId(db.suppliers, pk[r.p.id] && pk[r.p.id].sup || r.sup)) || {}).name || ''])); },
  ssRange:v => { const d = new Date(); [ui.ssFrom, ui.ssTo] = v === 'y' ? [d.getFullYear() + '-01-01', today()] : monthRange(+v); render(); },

  changePwd: () => formModal({title:'修改密码', okText:'确认修改', fields:[
    {n:'old', l:'当前密码', type:'password', req:1}, {n:'pwd', l:'新密码（至少 6 位）', type:'password', req:1}, {n:'pwd2', l:'确认新密码', type:'password', req:1}],
    onSubmit:async v => {

    LS.set('token', null); ME = null; showLogin();

  userEdit: id => userEdit(id),
  roleEdit: id => roleEdit(id),
  roleCopy: id => roleEdit(id, true),
  roleDel: id => { const r = ROLES.find(x => x.id === id); confirmBox(r.users ? `还有 ${r.users} 个账号使用「${esc(r.name)}」，请先给他们换角色。` : `确定删除角色「${esc(r.name)}」吗？`, () => { if (!r.users) mutate('DELETE', '/api/roles/' + id, undefined, '角色已删除'); }, r.users ? {title:'无法删除', danger:false, okText:'知道了'} : {}); },
  userDel: id => { const u = USERS.find(x => x.id === id); confirmBox(`确定删除用户「${esc(u.name)}（${esc(u.username)}）」吗？`, () => mutate('DELETE', '/api/users/' + id, undefined, '用户已删除')); },

      if (!NATIVE) toast('备份已导出');

  restore: () => $('#importFile').click(),

  clearAll: () => confirmBox('将删除服务器上的所有业务数据（保留用户账号和系统设置），此操作不可撤销！', () => mutate('POST', '/api/clear', {}, '数据已清空'), {title:'危险操作', okText:'确认清空'})
};
['ship', 'complete', 'approve', 'inbound', 'post', 'offset', 'cancel', 'orderDel', 'pay'].forEach(a => { A[a] = v => { const [k, id] = split(v); orderAct(a, k, id); }; });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!e.target.closest('.bell-wrap')) $('#bellDrop').classList.remove('show');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset.id, el); }
});
document.addEventListener('input', e => { const k = e.target.dataset.search; if (k) { const st = getState(k); st.q = e.target.value; st.page = 1; renderList(k); } });
document.addEventListener('change', e => { const f = e.target.dataset.filter; if (f) { const [k, fk] = split(f); getState(k).f[fk] = e.target.value; getState(k).page = 1; renderList(k); } });
$('#mask').addEventListener('mousedown', e => { if (e.target.id === 'mask') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !closePicker()) closeModal(); });
$('#gsearch').addEventListener('keydown', e => { if (e.key === 'Enter') globalSearch(e.target.value); });
$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    e.target.value = '';
    let d;
    try { d = JSON.parse(r.result); } catch (err) { return toast('导入失败：文件不是有效的 JSON', 'error'); }
    confirmBox('导入将覆盖服务器上的全部业务数据，确定继续？', () => mutate('POST', '/api/restore', d, '导入成功'));
  };
  r.readAsText(file);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (db.settings.theme === 'auto') { applyTheme(); render(); } });
window.addEventListener('hashchange', render);

/* ================= 安卓客户端：扫码按钮 / 返回键 / 切换服务器 ================= */
if (NATIVE) {
  document.documentElement.classList.add('native');
  // 记住最后一个获得焦点的输入框：扫码结果填进去并模拟扫码枪的回车
  const SCAN_INPUT = 'input:not([type=checkbox]):not([type=radio]):not([type=date]):not([type=file]):not([type=password]),textarea';
  let lastInput = null;
  document.addEventListener('focusin', e => { if (e.target.matches(SCAN_INPUT)) lastInput = e.target; });
  const fab = document.createElement('button');
  fab.id = 'scanFab'; fab.type = 'button'; fab.title = '扫码'; fab.innerHTML = ic('barcode');
  ['pointerdown', 'mousedown'].forEach(t => fab.addEventListener(t, e => e.preventDefault()));  // 不抢输入框的焦点
  fab.addEventListener('click', () => {
    if (!ME) return toast('请先登录', 'error');
    const a = document.activeElement;
    if (a && a.matches(SCAN_INPUT)) lastInput = a;
    else if ($('#mask').classList.contains('show') && lastInput && !lastInput.closest('#modal, #pickMask')) lastInput = null;  // 弹窗开着时不往背后的页面里填
    NATIVE.scan();
  });
  document.body.appendChild(fab);
  window.__xerpScanResult = code => {
    code = String(code || '').trim(); if (!code) return;
    const el = lastInput && lastInput.isConnected && lastInput.offsetParent !== null ? lastInput : null;
    if (el) {
      el.focus(); el.value = el.tagName === 'TEXTAREA' && el.value.trim() ? el.value.replace(/\s*$/, '\n') + code : code;
      el.dispatchEvent(new Event('input', {bubbles:true}));
      el.dispatchEvent(new Event('change', {bubbles:true}));
      if (el.isConnected) el.dispatchEvent(new KeyboardEvent('keydown', {key:'Enter', bubbles:true}));
      if (el.id === 'ckQ' && $('#ckLoop') && $('#ckLoop').checked) setTimeout(() => { if ($('#ckQ')) { lastInput = $('#ckQ'); NATIVE.scan(); } }, 500);  // 盘点扫码累加：连续扫
      return;
    }
    // 没有正在填的输入框：按条码 / 编码直接找商品
    const p = findProduct(code);
    if (p && can('inv.view')) { prodLogs(p.id); toast(p.name + ' · 当前库存 ' + p.stock, 'info'); }
    else globalSearch(code);
  };
  // 返回键：先关弹窗、下拉、侧栏，处理了返回 true
  window.__xerpBack = () => {
    if (closePicker()) return true;
    if ($('#mask').classList.contains('show')) { closeModal(); return true; }
    if ($('#bellDrop').classList.contains('show')) { $('#bellDrop').classList.remove('show'); return true; }
    if ($('#app').classList.contains('open')) { $('#app').classList.remove('open'); return true; }
    return false;
  };
  $('#lBtn').insertAdjacentHTML('afterend', `<p style="text-align:center;margin-top:14px;font-size:13px"><span class="sub-t">服务器 ${esc(NATIVE.server().replace(/^https?:\/\//, ''))}</span> · <a class="link" data-act="nativeServer">切换</a></p>`);
}

$('#lBtn').onclick = doLogin;
$('#srvTest').onclick = testServer;
boot();
